// ======================================================================
// Compte rendu de séance : prévu vs réalisé
// ======================================================================

// ======================================================================
// Analyse par intervalle (laps de la montre)
// ======================================================================

// Pourcentages de VMA visés pour chaque phase de la séance
function sessionTargets(session) {
  const fam = WORKOUTS[session.type];
  if (fam) {
    const list = fam[session.phase || "build"] || fam.build;
    const v = list[(session.variant ?? 0) % list.length];
    return { warmup: 68, work: v.workPct, rest: v.restPct, cooldown: 65 };
  }
  const cont = { longue: 70, fonda: 68, recup: 62 }[session.type] || 68;
  return { warmup: cont, work: cont, rest: cont, cooldown: cont };
}

/**
 * Classe chaque lap : échauffement, effort, récup ou retour au calme.
 * On se base sur l'allure rapportée à la VMA plutôt que sur l'ordre des
 * tours, car les montres mélangent tours automatiques (km) et tours manuels.
 */
function classifyLaps(laps, vma, session) {
  if (!laps || !laps.length || !vma) return [];
  const t = sessionTargets(session);
  const isInterval = ["fractionne", "seuil", "cotes"].includes(session.type);

  const enriched = laps.map((l, i) => {
    const speed = l.sec > 0 ? (l.m / l.sec) * 3.6 : 0;
    const pct = vma ? (speed / vma) * 100 : 0;
    return { ...l, i, speed, pct, pace: speed > 0 ? 60 / speed : null };
  });

  const longIdx = enriched.filter(l => l.sec >= 150).map(l => l.i);
  const firstLong = longIdx.length ? Math.min(...longIdx) : -1;
  const lastLong = longIdx.length ? Math.max(...longIdx) : -1;

  return enriched.map(l => {
    let kind;
    if (!isInterval) kind = "continu";
    else if (l.i === firstLong && l.sec >= 150) kind = "echauffement";
    else if (l.i === lastLong && l.sec >= 150 && lastLong !== firstLong) kind = "calme";
    else if (l.pct >= (t.work - 12)) kind = "effort";
    else if (l.sec <= 120) kind = "recup";
    else kind = "endurance";

    const targetPct = { echauffement: t.warmup, calme: t.cooldown, effort: t.work, recup: t.rest, endurance: t.warmup, continu: t.work }[kind];
    return { ...l, kind, targetPct };
  });
}

/**
 * Un écart ne se juge pas de la même façon selon la phase :
 * - sur un EFFORT, aller plus vite que la cible est bon, être trop lent alerte
 * - sur une RÉCUP / un échauffement / un retour au calme, c'est l'inverse :
 *   aller trop vite signifie qu'on ne récupère pas vraiment
 * Vert = conforme à l'intention de la phase, ambre = s'en écarte.
 */
const FASTER_IS_BETTER = { effort: true, continu: true };
function deltaOk(kind, delta) {
  if (delta === null) return true;
  return FASTER_IS_BETTER[kind] ? delta <= 15 : delta >= -15;
}
const deltaColor = (kind, delta) => (deltaOk(kind, delta) ? "var(--green)" : "var(--amber)");

const KIND_LABEL = { echauffement: "Échauffement", effort: "Effort", recup: "Récup", calme: "Retour au calme", endurance: "Endurance", continu: "Séance" };
const KIND_COLOR = { echauffement: "var(--green)", effort: "var(--accent)", recup: "var(--blue)", calme: "var(--green)", endurance: "var(--green)", continu: "var(--accent)" };

function fmtPace(p) {
  if (!p || !isFinite(p)) return "—";
  const m = Math.floor(p);
  const s = Math.round((p - m) * 60);
  return s === 60 ? `${m + 1}:00` : `${m}:${String(s).padStart(2, "0")}`;
}

/**
 * Courbe de FC en fonction du temps, reconstruite à partir des tours.
 * Chaque tour est un palier à sa FC moyenne : sur du 30/30 on obtient la
 * dentelure caractéristique, et on voit la dérive cardiaque au fil des séries.
 */
function HeartRateChart({ laps }) {
  const withFc = laps.filter(l => l.fc);
  if (withFc.length < 2) return null;

  const W = 320, H = 150, PL = 30, PR = 6, PT = 8, PB = 18;
  const total = laps.reduce((a, l) => a + l.sec, 0);
  const fcs = withFc.map(l => l.fc);
  const lo = Math.floor((Math.min(...fcs) - 5) / 5) * 5;
  const hi = Math.ceil((Math.max(...fcs) + 5) / 5) * 5;

  const x = t => PL + (t / total) * (W - PL - PR);
  const y = f => PT + (1 - (f - lo) / (hi - lo)) * (H - PT - PB);

  // segments horizontaux successifs (un par tour)
  let t = 0;
  const segs = laps.map(l => {
    const s = { x1: x(t), x2: x(t + l.sec), y: l.fc ? y(l.fc) : null, kind: l.kind };
    t += l.sec;
    return s;
  }).filter(s => s.y !== null);

  // ligne continue reliant les paliers
  const path = segs.map((s, i) =>
    (i === 0 ? `M ${s.x1} ${s.y}` : `L ${s.x1} ${s.y}`) + ` L ${s.x2} ${s.y}`
  ).join(" ");

  const ticks = [lo, Math.round((lo + hi) / 2), hi];
  const timeTicks = [0, 0.25, 0.5, 0.75, 1].map(f => f * total);

  return (
    <div>
      <div className="flex items-center justify-between mb-1">
        <p className="text-xs uppercase tracking-wider" style={{ color: "var(--green)", fontFamily: "'JetBrains Mono', monospace" }}>
          FC dans le temps
        </p>
        <p className="text-xs" style={{ color: "var(--muted)" }}>
          {Math.min(...fcs)}–{Math.max(...fcs)} bpm
        </p>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height: "auto" }}>
        {/* grille */}
        {ticks.map(f => (
          <g key={f}>
            <line x1={PL} y1={y(f)} x2={W - PR} y2={y(f)} strokeWidth="0.5" style={{ stroke: "var(--border)" }}/>
            <text x={PL - 4} y={y(f) + 3} textAnchor="end" fontSize="8" fontFamily="monospace" style={{ fill: "var(--muted)" }}>{f}</text>
          </g>
        ))}
        {timeTicks.map((tt, i) => (
          <text key={i} x={x(tt)} y={H - 5} textAnchor="middle" fontSize="8" fontFamily="monospace" style={{ fill: "var(--muted)" }}>
            {Math.round(tt / 60)}′
          </text>
        ))}

        {/* fond des efforts, pour situer les fractions */}
        {segs.filter(s => s.kind === "effort").map((s, i) => (
          <rect key={i} x={s.x1} y={PT} width={Math.max(0.8, s.x2 - s.x1)} height={H - PT - PB} opacity="0.13" style={{ fill: "var(--accent)" }}/>
        ))}

        <path d={path} fill="none" strokeWidth="1.4" strokeLinejoin="round" style={{ stroke: "var(--accent2)" }}/>
      </svg>
      <div className="flex gap-3 text-xs mt-1" style={{ color: "var(--muted)" }}>
        <span><span style={{ color: "var(--accent)" }}>▮</span> efforts</span>
        <span>paliers = FC moyenne par tour</span>
      </div>
    </div>
  );
}

function LapAnalysis({ session, vma }) {
  const laps = classifyLaps(session.actual?.laps, vma, session);
  if (!laps.length) return null;

  // Moyennes par phase, affichées en synthèse sous le détail
  const order = ["echauffement", "effort", "recup", "endurance", "calme", "continu"];
  const groups = order
    .map(k => ({ kind: k, items: laps.filter(l => l.kind === k) }))
    .filter(g => g.items.length);

  const counters = {};

  return (
    <div className="rounded-lg p-3 space-y-3" style={{ background: "var(--surface2)", border: "1px solid var(--border)" }}>
      <p className="text-sm" style={{ fontFamily: "'Space Grotesk', sans-serif", color: "var(--accent)" }}>
        Déroulé de la séance
      </p>

      <HeartRateChart laps={laps} />

      <p className="text-xs leading-relaxed" style={{ color: "var(--muted)" }}>
        Écart à l'allure cible : <span style={{ color: "var(--text)" }}>−</span> plus rapide,
        <span style={{ color: "var(--text)" }}> +</span> plus lent.
        <span style={{ color: "var(--green)" }}> Vert</span> = conforme à l'intention de la phase
        (vite sur les efforts, lent sur les récups),
        <span style={{ color: "var(--amber)" }}> ambre</span> = s'en écarte.
      </p>

      {/* ordre chronologique : chaque tour tel qu'il s'est enchaîné */}
      <div className="space-y-1">
        {laps.map(l => {
          counters[l.kind] = (counters[l.kind] || 0) + 1;
          const n = counters[l.kind];
          const target = vma ? 60 / (vma * l.targetPct / 100) : null;
          const delta = l.pace && target ? Math.round((l.pace - target) * 60) : null;
          const label = KIND_LABEL[l.kind] + (["effort", "recup"].includes(l.kind) ? ` ${n}` : "");

          return (
            <div key={l.i} className="flex items-baseline justify-between text-xs py-0.5"
              style={{ borderBottom: "1px solid var(--surface3)" }}>
              <span className="shrink-0" style={{ color: KIND_COLOR[l.kind], minWidth: "5.5rem" }}>{label}</span>
              <span style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--muted)" }}>
                {l.sec}s·{Math.round(l.m)}m
              </span>
              <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>
                <span style={{ color: "var(--accent)" }}>{fmtPace(l.pace)}</span>
                <span style={{ color: "var(--muted)" }}>/{fmtPace(target)}</span>
              </span>
              {delta !== null && (
                <span style={{ fontFamily: "'JetBrains Mono', monospace", color: deltaColor(l.kind, delta), minWidth: "2.6rem", textAlign: "right" }}>
                  {delta > 0 ? "+" : ""}{delta}s
                </span>
              )}
              <span style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--blue)", minWidth: "2.2rem", textAlign: "right" }}>
                {l.fc ? Math.round(l.fc) : "—"}
              </span>
            </div>
          );
        })}
      </div>

      {/* synthèse par phase */}
      <div className="pt-2 space-y-1" style={{ borderTop: "1px solid var(--border)" }}>
        <p className="text-xs uppercase tracking-wider" style={{ color: "var(--green)", fontFamily: "'JetBrains Mono', monospace" }}>
          Moyennes
        </p>
        {groups.map(g => {
          const totSec = g.items.reduce((a, l) => a + l.sec, 0);
          const totM = g.items.reduce((a, l) => a + l.m, 0);
          const avgPace = totM > 0 ? (totSec / 60) / (totM / 1000) : null;
          const fcs = g.items.filter(l => l.fc).map(l => l.fc);
          const avgFc = fcs.length ? Math.round(fcs.reduce((a, b) => a + b, 0) / fcs.length) : null;
          const target = vma ? 60 / (vma * g.items[0].targetPct / 100) : null;
          const delta = avgPace && target ? Math.round((avgPace - target) * 60) : null;
          return (
            <div key={g.kind} className="flex justify-between text-xs">
              <span style={{ color: KIND_COLOR[g.kind] }}>
                {KIND_LABEL[g.kind]}{g.items.length > 1 ? ` ×${g.items.length}` : ""}
              </span>
              <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>
                <span style={{ color: "var(--accent)" }}>{fmtPace(avgPace)}</span>
                <span style={{ color: "var(--muted)" }}>/{fmtPace(target)}</span>
                {delta !== null && (
                  <span style={{ color: deltaColor(g.kind, delta), marginLeft: 5 }}>
                    {delta > 0 ? "+" : ""}{delta}s
                  </span>
                )}
                {avgFc && <span style={{ color: "var(--blue)", marginLeft: 6 }}>{avgFc}</span>}
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ======================================================================
// Ravitaillement consommé pendant la séance
// ======================================================================

// Teneur en glucides par unité — valeurs courantes, ajustables à la main
// via le champ « autres » si tes produits diffèrent.
const FUEL_ITEMS = [
  { key: "gels", label: "Gels", carbs: 30 },
  { key: "purees", label: "Purées", carbs: 15 },
  { key: "barres", label: "Barres", carbs: 20 },
  { key: "sale", label: "Salé", carbs: 15 },
  { key: "pastilles", label: "Pastilles", carbs: 1, sodium: 300 },
];

// Boisson : valeurs par dose de 500 ml
const DEFAULT_DRINK = { carbsPer500: 35, sodiumPer500: 300 };

// Teneurs par défaut, remplaçables par tes produits réels dans l'onglet Nutrition
const DEFAULT_PRODUCTS = FUEL_ITEMS.reduce((a, it) => ({ ...a, [it.key]: it.carbs }), {});
const carbsOf = (key, products) => Number((products || DEFAULT_PRODUCTS)[key] ?? DEFAULT_PRODUCTS[key]) || 0;

const EMPTY_FUEL = {
  gels: 0, purees: 0, barres: 0, sale: 0, pastilles: 0,
  drinkMl: 0, drinkCarbsPer500: DEFAULT_DRINK.carbsPer500,
  drinkSodiumPer500: DEFAULT_DRINK.sodiumPer500, autresG: 0,
};

function fuelTotals(f, dureeMin, products) {
  if (!f) return null;
  // une séance enregistrée garde la teneur des produits utilisés ce jour-là
  const prod = f.carbsPerUnit || products;
  const fromItems = FUEL_ITEMS.reduce((a, it) => a + (Number(f[it.key]) || 0) * carbsOf(it.key, prod), 0);
  const fromDrink = ((Number(f.drinkMl) || 0) / 500) * (Number(f.drinkCarbsPer500) || 0);
  const carbs = Math.round(fromItems + fromDrink + (Number(f.autresG) || 0));
  const ml = Number(f.drinkMl) || 0;

  // Sodium : pastilles d'électrolytes + boisson d'effort
  const naItems = FUEL_ITEMS.reduce((a, it) => a + (Number(f[it.key]) || 0) * (it.sodium || 0), 0);
  const naDrink = (ml / 500) * (Number(f.drinkSodiumPer500) ?? DEFAULT_DRINK.sodiumPer500);
  const sodium = Math.round(naItems + naDrink);

  const h = dureeMin ? dureeMin / 60 : 0;
  return {
    carbs, ml, sodium,
    carbsPerH: h > 0 ? Math.round(carbs / h) : null,
    mlPerH: h > 0 ? Math.round(ml / h) : null,
    sodiumPerH: h > 0 ? Math.round(sodium / h) : null,
    isEmpty: carbs === 0 && ml === 0 && sodium === 0,
  };
}

function FuelingInputs({ value, onChange, dureeMin, products }) {
  const f = value || EMPTY_FUEL;
  const set = (k, v) => onChange({ ...f, [k]: v });
  const tot = fuelTotals(f, dureeMin, products);
  const inputCls = "w-full rounded-lg px-2 py-1.5 text-sm outline-none";
  const inputStyle = { background: "var(--bg)", color: "var(--text)", border: "1px solid var(--border)" };

  return (
    <div className="space-y-2">
      <p className="text-xs" style={{ color: "var(--muted)" }}>
        Ravitaillement pendant la séance (optionnel)
      </p>

      <div className="grid grid-cols-5 gap-2">
        {FUEL_ITEMS.map(it => (
          <div key={it.key}>
            <label className="text-xs" style={{ color: "var(--muted)" }}>{it.label}</label>
            <input type="number" min="0" value={f[it.key] || ""} placeholder="0"
              onChange={e => set(it.key, Number(e.target.value) || 0)}
              className={inputCls} style={inputStyle} />
            <p className="text-xs" style={{ color: "var(--border2)", fontFamily: "'JetBrains Mono', monospace" }}>{carbsOf(it.key, products)} g/u</p>
          </div>
        ))}
      </div>

      <div className="grid grid-cols-4 gap-2">
        <div>
          <label className="text-xs" style={{ color: "var(--muted)" }}>Boisson (ml)</label>
          <input type="number" min="0" value={f.drinkMl || ""} placeholder="0"
            onChange={e => set("drinkMl", Number(e.target.value) || 0)} className={inputCls} style={inputStyle} />
        </div>
        <div>
          <label className="text-xs" style={{ color: "var(--muted)" }}>g / 500 ml</label>
          <input type="number" min="0" value={f.drinkCarbsPer500 ?? ""} placeholder="30"
            onChange={e => set("drinkCarbsPer500", Number(e.target.value) || 0)} className={inputCls} style={inputStyle} />
        </div>
        <div>
          <label className="text-xs" style={{ color: "var(--muted)" }}>mg Na / 500 ml</label>
          <input type="number" min="0" value={f.drinkSodiumPer500 ?? ""} placeholder="300"
            onChange={e => set("drinkSodiumPer500", Number(e.target.value) || 0)} className={inputCls} style={inputStyle} />
        </div>
        <div>
          <label className="text-xs" style={{ color: "var(--muted)" }}>Autres (g)</label>
          <input type="number" min="0" value={f.autresG || ""} placeholder="0"
            onChange={e => set("autresG", Number(e.target.value) || 0)} className={inputCls} style={inputStyle} />
        </div>
      </div>

      {tot && !tot.isEmpty && (
        <p className="text-xs" style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--accent)" }}>
          {tot.carbs} g de glucides · {(tot.ml / 1000).toFixed(1)} L · {tot.sodium} mg Na
          {tot.carbsPerH !== null && <span style={{ color: "var(--muted)" }}> — soit {tot.carbsPerH} g/h et {tot.mlPerH} ml/h</span>}
        </p>
      )}
    </div>
  );
}

// Comparaison de ce qui a été pris avec ce que la séance demandait
function FuelingReport({ session, products }) {
  const f = session.actual?.fueling;
  const duree = session.actual?.duree ?? session.duree;
  const tot = fuelTotals(f, duree, products);
  if (!tot || tot.isEmpty) return null;

  const target = fuelingPlan({ durationMin: duree, tempC: 18, weightKg: null, intensity: "moderee" });
  const carbGap = target.carbs > 0 && tot.carbsPerH !== null ? tot.carbsPerH - target.carbs : null;
  const fluidGap = tot.mlPerH !== null ? tot.mlPerH - target.fluid : null;

  const row = (label, real, plan, unit, gap) => (
    <div className="flex justify-between text-xs">
      <span style={{ color: "var(--muted2)" }}>{label}</span>
      <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>
        <span style={{ color: "var(--accent)" }}>{real}</span>
        <span style={{ color: "var(--muted)" }}> / {plan} {unit}</span>
        {gap !== null && (
          <span style={{ color: Math.abs(gap) <= (unit === "g/h" ? 10 : 150) ? "var(--green)" : "var(--amber)", marginLeft: 5 }}>
            {gap > 0 ? "+" : ""}{gap}
          </span>
        )}
      </span>
    </div>
  );

  return (
    <div className="rounded-lg p-3 space-y-2" style={{ background: "var(--surface2)", border: "1px solid var(--border)" }}>
      <p className="text-sm" style={{ fontFamily: "'Space Grotesk', sans-serif", color: "var(--accent)" }}>
        Ravitaillement
      </p>
      {row("Glucides", tot.carbsPerH ?? "—", target.carbs, "g/h", carbGap)}
      {row("Boisson", tot.mlPerH ?? "—", target.fluid, "ml/h", fluidGap)}
      {row("Sodium", tot.sodiumPerH ?? "—", target.sodium, "mg/h",
        tot.sodiumPerH !== null ? tot.sodiumPerH - target.sodium : null)}
      <p className="text-xs" style={{ color: "var(--muted)", fontFamily: "'JetBrains Mono', monospace" }}>
        total : {tot.carbs} g · {(tot.ml / 1000).toFixed(1)} L · {tot.sodium} mg Na
      </p>
      {duree >= 150 && carbGap !== null && carbGap < -15 && (
        <p className="text-xs leading-relaxed" style={{ color: "var(--amber)" }}>
          Nettement sous la cible sur une sortie longue : c'est précisément le format où l'intestin doit
          s'entraîner à absorber davantage. Monte progressivement d'une sortie à l'autre.
        </p>
      )}
    </div>
  );
}

function paceStr(distanceKm, dureeMin) {
  if (!distanceKm || !dureeMin) return null;
  const p = dureeMin / distanceKm;
  const m = Math.floor(p);
  const sec = Math.round((p - m) * 60);
  return sec === 60 ? `${m + 1}:00` : `${m}:${String(sec).padStart(2, "0")}`;
}

// Une ligne = deux barres proportionnelles (prévu en gris, réalisé en orange)
function CompareRow({ label, planned, actual, unit, lowerIsBetter = false, format }) {
  const max = Math.max(planned || 0, actual || 0) || 1;
  const pctP = ((planned || 0) / max) * 100;
  const pctA = ((actual || 0) / max) * 100;
  const delta = planned && actual ? ((actual - planned) / planned) * 100 : null;
  const good = delta === null ? null : (lowerIsBetter ? delta <= 2 : delta >= -10);

  return (
    <div className="space-y-1">
      <div className="flex justify-between text-xs">
        <span style={{ color: "var(--muted2)" }}>{label}</span>
        {/* les chiffres reprennent la couleur de leur barre : gris = prévu, orange = réalisé */}
        <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>
          <span style={{ color: "var(--accent)" }}>{format ? format(actual) : (actual ?? "—")}</span>
          <span style={{ color: "var(--muted)" }}> / {format ? format(planned) : (planned ?? "—")} {format ? "" : unit}</span>
          {delta !== null && (
            <span style={{ color: good ? "var(--green)" : "var(--amber)", marginLeft: 6 }}>
              {delta > 0 ? "+" : ""}{Math.round(delta)}%
            </span>
          )}
        </span>
      </div>
      <div className="space-y-0.5">
        <div className="h-1.5 rounded-full" style={{ width: `${pctP}%`, background: "var(--border)", minWidth: 2 }} />
        <div className="h-1.5 rounded-full" style={{ width: `${pctA}%`, background: "var(--accent)", minWidth: 2 }} />
      </div>
    </div>
  );
}

function SessionReport({ s, vma }) {
  const a = s.actual || {};

  // Sur une séance à intervalles, seule la FC pendant les efforts est
  // interprétable — la moyenne de séance est diluée par les récups.
  const effortLaps = classifyLaps(a.laps, vma, s).filter(l => l.kind === "effort" && l.fc);
  const effortFc = effortLaps.length
    ? {
        avg: Math.round(effortLaps.reduce((x, l) => x + l.fc, 0) / effortLaps.length),
        max: Math.round(Math.max(...effortLaps.map(l => l.fc))),
      }
    : null;
  const planPace = paceStr(s.distance, s.duree);
  const realPace = paceStr(a.distance, a.duree);

  // écart d'allure en secondes/km, pour un commentaire utile
  const paceDeltaSec = (s.distance && s.duree && a.distance && a.duree)
    ? Math.round(((a.duree / a.distance) - (s.duree / s.distance)) * 60)
    : null;

  const gradPlan = s.distance && s.dplus ? Math.round(s.dplus / s.distance) : null;
  const gradReal = a.distance && a.dplus ? Math.round(a.dplus / a.distance) : null;

  // % de VMA estimé sur la séance, à partir de l'allure moyenne réelle
  const vmaPct = (vma && a.distance && a.duree)
    ? Math.round((a.distance / (a.duree / 60)) / vma * 100)
    : null;

  return (
    <div className="rounded-lg p-3 space-y-3" style={{ background: "var(--surface2)", border: "1px solid var(--border)" }}>
      <div className="flex items-center justify-between">
        <p className="text-sm" style={{ fontFamily: "'Space Grotesk', sans-serif", color: "var(--accent)" }}>Compte rendu</p>
        <p className="text-xs" style={{ color: "var(--muted)", fontFamily: "'JetBrains Mono', monospace" }}>
          {a.feeling ? `ressenti ${a.feeling}/5` : ""}
        </p>
      </div>

      <div className="flex gap-3 text-xs">
        <span style={{ color: "var(--muted)" }}>▬ prévu</span>
        <span style={{ color: "var(--accent)" }}>▬ réalisé</span>
      </div>

      <div className="space-y-2.5">
        <CompareRow label="Distance" planned={s.distance} actual={a.distance} unit="km" />
        {(s.dplus || a.dplus) && <CompareRow label="Dénivelé" planned={s.dplus} actual={a.dplus} unit="m" />}
        <CompareRow label="Durée" planned={s.duree} actual={a.duree} unit="min" format={fmtDuree} />
      </div>

      {(planPace || realPace) && (
        <div className="pt-2" style={{ borderTop: "1px solid var(--border)" }}>
          <div className="flex justify-between text-xs">
            <span style={{ color: "var(--muted2)" }}>Allure moyenne</span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>
              <span style={{ color: "var(--accent)" }}>{realPace || "—"}</span>
              <span style={{ color: "var(--muted)" }}> / {planPace || "—"} /km</span>
            </span>
          </div>
          {paceDeltaSec !== null && (
            <p className="text-xs mt-1" style={{ color: Math.abs(paceDeltaSec) <= 15 ? "var(--green)" : "var(--amber)" }}>
              {paceDeltaSec === 0 ? "pile sur l'allure prévue"
                : paceDeltaSec > 0 ? `${paceDeltaSec}s/km plus lent que prévu`
                : `${-paceDeltaSec}s/km plus rapide que prévu`}
            </p>
          )}
        </div>
      )}

      {(gradPlan || gradReal) && (
        <div className="flex justify-between text-xs">
          <span style={{ color: "var(--muted2)" }}>Densité D+</span>
          <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>
            <span style={{ color: "var(--accent)" }}>{gradReal ?? "—"}</span>
            <span style={{ color: "var(--muted)" }}> / {gradPlan ?? "—"} m/km</span>
          </span>
        </div>
      )}

      {effortFc && (

    sessions.forEach(s => {

      if (!map.has(wk)) map.set(wk, []);
      map.get(wk).push(s);
    });
    return [...map.entries()].sort(([a], [b]) => a.localeCompare(b));
  }, [sessions]);

  return (
    <div className="space-y-4 lg:space-y-0 lg:grid lg:grid-cols-2 lg:gap-4 lg:items-start">
      {weeks.map(([weekStart, weekSessions]) => {
        const isPast = addDays(weekStart, 6) < new Date();
        if (isPast && weekSessions.every(s => s.done || !s.generated)) return null; // masque semaines passées complètes

// Recharts pose les couleurs en attributs SVG : on résout donc les
// variables CSS à l'exécution plutôt que de leur passer var(...).
function cssVar(name) {
  if (typeof getComputedStyle === "undefined") return undefined;
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || undefined;
}

const GRANULARITIES = [
  { key: "week",  label: "Semaine", count: 12 },
  { key: "month", label: "Mois",    count: 12 },
  { key: "year",  label: "Année",   count: 5 },
];

const METRICS = [
  { key: "km",   label: "Distance", unit: "km",   color: "--accent" },
  { key: "dplus",label: "Dénivelé", unit: "m D+", color: "--amber"  },
  { key: "min",  label: "Temps",    unit: "h",    color: "--green"  },
];

// Clé de regroupement d'une séance selon la granularité choisie
function periodKey(dateStr, gran) {
  if (gran === "year") return dateStr.slice(0, 4);
  if (gran === "month") return dateStr.slice(0, 7);
  return toISO(isoWeekStart(dateStr));
}
function periodLabel(key, gran) {
  if (gran === "year") return key;
  if (gran === "month") {
    const [y, m] = key.split("-");
    return new Date(Number(y), Number(m) - 1, 1)
      .toLocaleDateString("fr-FR", { month: "short" }) + " " + y.slice(2);
  }
  return fmtDate(key);
}

/**
 * Agrège toutes les séances réalisées par période, en séparant la course
 * à pied des activités complémentaires — les kilomètres de vélo n'ont pas
 * le même sens que ceux de course.
 */
function aggregate(sessions, gran) {
  const map = new Map();
  const val = (s, f) => s.actual?.[f] ?? s[f] ?? 0;

  sessions.forEach(s => {
    const d = s.date || s.weekStart;
    if (!d) return;
    const k = periodKey(d, gran);
    if (!map.has(k)) map.set(k, {
      key: k, runKm: 0, runD: 0, runMin: 0, runN: 0,
      crossKm: 0, crossMin: 0, crossN: 0, planKm: 0, byType: {},
    });
    const e = map.get(k);

    if (s.generated && !isCross(s.type)) e.planKm += s.distance || 0;
    if (!s.done) return;

    const km = val(s, "distance"), dp = val(s, "dplus"), mn = val(s, "duree");
    if (isCross(s.type)) { e.crossKm += km; e.crossMin += mn; e.crossN += 1; }
    else { e.runKm += km; e.runD += dp; e.runMin += mn; e.runN += 1; }

    if (!e.byType[s.type]) e.byType[s.type] = { km: 0, min: 0, n: 0 };
    e.byType[s.type].km += km;
    e.byType[s.type].min += mn;
    e.byType[s.type].n += 1;
  });

  return [...map.values()].sort((a, b) => a.key.localeCompare(b.key));
}

const fmtH = fmtDuree;

function Stats({ sessions }) {
  const [gran, setGran] = useState("month");
  const [metric, setMetric] = useState("km");

  const g = GRANULARITIES.find(x => x.key === gran);
  const m = METRICS.find(x => x.key === metric);

  const all = useMemo(() => aggregate(sessions, gran), [sessions, gran]);
  // Les séances à venir créent des périodes futures : on s'arrête à
  // aujourd'hui, sinon le graphique afficherait le plan au lieu du réalisé.
  const nowKey = periodKey(toISO(new Date()), gran);
  const past = all.filter(e => e.key <= nowKey);
  const rows = past.slice(-g.count);

  const pick = e => metric === "km" ? e.runKm : metric === "dplus" ? e.runD : e.runMin / 60;
  const pickCross = e => metric === "km" ? e.crossKm : metric === "dplus" ? 0 : e.crossMin / 60;

  const chartData = rows.map(e => ({
    label: periodLabel(e.key, gran),
    course: Math.round(pick(e) * 10) / 10,
    complementaire: Math.round(pickCross(e) * 10) / 10,
    prevu: metric === "km" ? Math.round(e.planKm) : 0,
  }));

  // Cumuls sur tout l'historique
  const done = sessions.filter(s => s.done);
  const run = done.filter(s => !isCross(s.type));
  const cross = done.filter(s => isCross(s.type));
  const sum = (arr, f) => arr.reduce((a, s) => a + (s.actual?.[f] ?? s[f] ?? 0), 0);
  const totKm = sum(run, "distance"), totD = sum(run, "dplus"), totMin = sum(run, "duree");

  // Période en cours et précédente, pour situer la tendance
  const cur = past[past.length - 1], prev = past[past.length - 2];
  const trend = (a, b) => (b && b > 0) ? Math.round(((a - b) / b) * 100) : null;

  // Records
  const longest = run.reduce((a, s) => (s.actual?.distance ?? s.distance ?? 0) > (a.d || 0)
    ? { d: s.actual?.distance ?? s.distance, date: s.date } : a, {});
  const hilliest = run.reduce((a, s) => (s.actual?.dplus ?? s.dplus ?? 0) > (a.d || 0)
    ? { d: s.actual?.dplus ?? s.dplus, date: s.date } : a, {});
  const bestWeek = aggregate(sessions, "week").reduce((a, e) => e.runKm > (a.runKm || 0) ? e : a, {});

  // Répartition par type sur la période affichée
  const typeTotals = {};
  rows.forEach(e => Object.entries(e.byType).forEach(([t, v]) => {
    if (!typeTotals[t]) typeTotals[t] = { km: 0, min: 0, n: 0 };
    typeTotals[t].km += v.km; typeTotals[t].min += v.min; typeTotals[t].n += v.n;
  }));
  const typeMax = Math.max(1, ...Object.values(typeTotals).map(v => v.min));

  const cardStyle = { background: "var(--surface)", border: "1px solid var(--border)" };
  const maxVal = Math.max(1, ...chartData.map(d => Math.max(d.course, d.complementaire, d.prevu)));

  return (
    <div className="space-y-4 lg:space-y-0 lg:grid lg:grid-cols-2 lg:gap-4 lg:items-start">

      {/* ---------- cumuls ---------- */}
      <div className="grid grid-cols-3 gap-3 lg:col-span-2">
        {[["Distance", Math.round(totKm), "km"],
          ["Dénivelé", Math.round(totD), "m D+"],
          ["Temps", fmtH(totMin), ""]].map(([l, v, u]) => (
          <div key={l} className="rounded-xl p-3 text-center" style={cardStyle}>
            <p className="text-2xl" style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--text)" }}>{v}</p>
            <p className="text-xs" style={{ color: "var(--muted)" }}>{u}</p>
            <p className="text-xs mt-1" style={{ color: "var(--green)" }}>{l} · course</p>
          </div>
        ))}
      </div>

      {/* ---------- graphique ---------- */}
      <div className="rounded-xl p-4 lg:col-span-2" style={cardStyle}>
        <div className="flex gap-1 rounded-lg p-1 mb-2" style={{ background: "var(--surface2)" }}>
          {GRANULARITIES.map(x => (
            <button key={x.key} onClick={() => setGran(x.key)} className="flex-1 py-1.5 rounded-md text-xs"
              style={{ background: gran === x.key ? "var(--accent)" : "transparent", color: gran === x.key ? "var(--bg)" : "var(--muted2)" }}>
              {x.label}
            </button>
          ))}
        </div>
        <div className="flex gap-1 rounded-lg p-1 mb-3" style={{ background: "var(--surface2)" }}>
          {METRICS.map(x => (
            <button key={x.key} onClick={() => setMetric(x.key)} className="flex-1 py-1.5 rounded-md text-xs"
              style={{ background: metric === x.key ? "var(--green)" : "transparent", color: metric === x.key ? "var(--bg)" : "var(--muted2)" }}>
              {x.label}
            </button>
          ))}
        </div>

        {chartData.length === 0 ? (
          <p className="text-sm text-center py-6" style={{ color: "var(--muted)" }}>
            Aucune séance enregistrée pour l'instant.
          </p>
        ) : !CHARTS_OK ? (
          <div className="space-y-1">
            {chartData.map(d => (
              <div key={d.label} className="flex items-center justify-between text-xs" style={{ color: "var(--muted2)" }}>
                <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>{d.label}</span>
                <span style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--accent)" }}>
                  {d.course} {m.unit}
                </span>
              </div>
            ))}
          </div>
        ) : (
          <div style={{ width: "100%", height: 200 }}>
            <ResponsiveContainer>
              <BarChart data={chartData}>
                <CartesianGrid strokeDasharray="3 3" stroke={cssVar("--border")} vertical={false} />
                <XAxis dataKey="label" stroke={cssVar("--muted")} fontSize={10} interval={0} angle={gran === "week" ? -35 : 0} textAnchor={gran === "week" ? "end" : "middle"} height={gran === "week" ? 45 : 25} />
                <YAxis stroke={cssVar("--muted")} fontSize={10} />
                <Tooltip contentStyle={{ background: cssVar("--surface"), border: "1px solid " + cssVar("--border"), color: cssVar("--text") }} />
                <Bar dataKey="course" fill={cssVar("--accent")} radius={[3, 3, 0, 0]} name={`Course (${m.unit})`} />
                {metric !== "dplus" && (

                )}
              </BarChart>
            </ResponsiveContainer>
          </div>
        )}

        {cur && prev && (
          <p className="text-xs mt-2 text-center" style={{ color: "var(--muted)" }}>
            {g.label.toLowerCase()} en cours : <span style={{ color: "var(--text)" }}>{Math.round(pick(cur) * 10) / 10} {m.unit}</span>
            {trend(pick(cur), pick(prev)) !== null && (
              <span style={{ color: trend(pick(cur), pick(prev)) >= 0 ? "var(--green)" : "var(--amber)" }}>
                {" "}({trend(pick(cur), pick(prev)) > 0 ? "+" : ""}{trend(pick(cur), pick(prev))}% vs précédent{g.key === "week" ? "e" : ""})
              </span>
            )}
          </p>
        )}
      </div>

      {/* ---------- répartition par activité ---------- */}
      <div className="rounded-xl p-4" style={cardStyle}>
        <p className="text-xs uppercase tracking-wider mb-3" style={{ color: "var(--green)", fontFamily: "'JetBrains Mono', monospace" }}>
          Répartition · {g.count} dernières périodes
        </p>
        {Object.keys(typeTotals).length === 0 ? (
          <p className="text-xs" style={{ color: "var(--muted)" }}>Rien à afficher.</p>
        ) : (
          <div className="space-y-2">
            {Object.entries(typeTotals).sort((a, b) => b[1].min - a[1].min).map(([t, v]) => (
              <div key={t}>
                <div className="flex justify-between text-xs mb-0.5">
                  <span style={{ color: TYPES[t]?.color || "var(--muted2)" }}>{TYPES[t]?.label || t} ×{v.n}</span>
                  <span style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--text)" }}>
                    {v.km ? `${Math.round(v.km)} km · ` : ""}{fmtH(v.min)}
                  </span>
                </div>
                <div className="h-1.5 rounded-full" style={{ width: `${(v.min / typeMax) * 100}%`, background: TYPES[t]?.color || "var(--muted)", minWidth: 3 }} />
              </div>
            ))}
          </div>
        )}
      </div>

      {/* ---------- records ---------- */}
      <div className="rounded-xl p-4" style={cardStyle}>
        <p className="text-xs uppercase tracking-wider mb-3" style={{ color: "var(--green)", fontFamily: "'JetBrains Mono', monospace" }}>
          Records
        </p>
        <div className="space-y-2">
          {[["Plus longue sortie", longest.d ? `${longest.d} km` : "—", longest.date],
            ["Plus gros dénivelé", hilliest.d ? `${Math.round(hilliest.d)} m D+` : "—", hilliest.date],
            ["Meilleure semaine", bestWeek.runKm ? `${Math.round(bestWeek.runKm)} km` : "—", bestWeek.key],
            ["Séances de course", `${run.length}`, null],
            ["Activités complémentaires", `${cross.length}`, null]].map(([l, v, d]) => (
            <div key={l} className="flex justify-between text-sm">
              <span style={{ color: "var(--muted2)" }}>{l}</span>
              <span style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--text)" }}>
                {v}{d ? <span style={{ color: "var(--muted)" }}> · {fmtDate(d)}</span> : null}
              </span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ======================================================================
// App
// ======================================================================

function App() {
  const [goal, setGoal] = useState(null);
  const [sessions, setSessions] = useState([]);
  const [evaluations, setEvaluations] = useState({});
  const [tab, setTab] = useState("plan");
  const [editingGoal, setEditingGoal] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [importText, setImportText] = useState("");
  const [importStatus, setImportStatus] = useState("");
  const [storageOk, setStorageOk] = useState(true);
  const [storageMsg, setStorageMsg] = useState("");
  const [backupText, setBackupText] = useState("");
  const [backupStatus, setBackupStatus] = useState("");
  const [showRestore, setShowRestore] = useState(false);
  const [syncCode, setSyncCode] = useState(() => (window.getSyncCode ? window.getSyncCode() : ""));
  const [syncMsg, setSyncMsg] = useState("");
  const [refreshMsg, setRefreshMsg] = useState("");
  const [theme, setTheme] = useState(() =>
    (typeof localStorage !== "undefined" && localStorage.getItem("trailcoach:theme")) || "dark");

  // Applique et mémorise le thème
  useEffect(() => {
    if (theme === "dark") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("trailcoach:theme", theme); } catch (e) {}
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", theme === "eink" ? "#FFFFFF" : theme === "light" ? "#F4F1E8" : "var(--bg)");
  }, [theme]);
  const lastSavedRef = React.useRef(0);
  const [weightKg, setWeightKg] = useState("");
  const [targetWeight, setTargetWeight] = useState("");
  const [products, setProducts] = useState({ ...DEFAULT_PRODUCTS });

  useEffect(() => {
    (async () => {
      try {
        if (window.__storageReady) await window.__storageReady;
        if (!window.storage || typeof window.storage.get !== "function") {
          setStorageOk(false);
          setStorageMsg("stockage indisponible");
          setEditingGoal(true);
          setLoaded(true);
          return;
        }
        const res = await window.storage.get("appstate", false);
        if (res?.value) {
          setStorageMsg(`données rechargées (${window.STORAGE_MODE ? window.STORAGE_MODE() : "local"})`);
          const data = JSON.parse(res.value);
          setGoal(data.goal || null);
          setSessions(data.sessions || []);
          setEvaluations(data.evaluations || {});
          setWeightKg(data.weightKg || "");
          setTargetWeight(data.targetWeight || "");
          setProducts({ ...DEFAULT_PRODUCTS, ...(data.products || {}) });
          if (!data.goal) setEditingGoal(true);
        } else {
          setEditingGoal(true);
        }
      } catch (e) { setEditingGoal(true); }
      setLoaded(true);
    })();
  }, []);

  // adaptive re-evaluation on load / whenever sessions change
  useEffect(() => {
    if (!loaded || sessions.length === 0) return;
    const { sessions: adj, evaluations: newEval } = evaluateAndAdjust(sessions, evaluations);
    if (JSON.stringify(newEval) !== JSON.stringify(evaluations)) {
      setSessions(adj);
      setEvaluations(newEval);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, sessions.length]);

  useEffect(() => {
    if (!loaded) return;

    // Garde-fou : ne jamais écrire un état vide par-dessus des données
    // existantes. Si une lecture a échoué (réseau, appareil neuf), l'état
    // local est vide — l'écrire écraserait tout ce qui est en ligne.
    if (!goal && sessions.length === 0) {
      setStorageMsg("rien à sauvegarder pour l'instant");
      return;
    }

    (async () => {
      try {
        if (!window.storage || typeof window.storage.set !== "function") {
          setStorageOk(false);
          setStorageMsg("stockage indisponible");
          return;
        }
        const r = await window.storage.set("appstate", JSON.stringify({ goal, sessions, evaluations, weightKg, targetWeight, products, updatedAt: Date.now() }), false);
        const ok = r !== null && r !== undefined;
        if (ok) lastSavedRef.current = Date.now();
        setStorageOk(ok);
        setStorageMsg(ok ? `${window.STORAGE_MODE ? window.STORAGE_MODE() : "local"} · sauvegardé ${new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}` : "échec de sauvegarde");
      } catch (e) {
        setStorageOk(false);
        setStorageMsg("erreur : " + String(e).slice(0, 60));
      }
    })();
  }, [goal, sessions, evaluations, weightKg, targetWeight, products, loaded]);

  // Quand l'app revient au premier plan, récupère ce qui a pu être modifié
  // sur un autre appareil. On ne remplace que si la version distante est
  // plus récente, pour ne jamais écraser une saisie en cours.
  useEffect(() => {
    if (!loaded) return;
    const onVisible = async () => {
      if (document.visibilityState !== "visible") return;
      if (!window.STORAGE_MODE || window.STORAGE_MODE() !== "firebase") return;
      try {
        const res = await window.storage.get("appstate", false);
        if (!res?.value) return;
        const data = JSON.parse(res.value);
        if (!data.updatedAt || data.updatedAt <= lastSavedRef.current) return;
        setGoal(data.goal || null);
        setSessions(data.sessions || []);
        setEvaluations(data.evaluations || {});
        if (data.weightKg) setWeightKg(data.weightKg);
        if (data.targetWeight) setTargetWeight(data.targetWeight);
        if (data.products) setProducts({ ...DEFAULT_PRODUCTS, ...data.products });
        lastSavedRef.current = data.updatedAt;
        setStorageMsg("mis à jour depuis un autre appareil");
      } catch (e) { /* hors ligne : on garde la version locale */ }
    };
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
  }, [loaded]);

  const saveNotes = (id, notes) => setSessions(prev => prev.map(s => s.id === id ? { ...s, notes } : s));

  // Active le code de synchro puis recharge les données distantes
  const applySyncCode = async () => {
    if (!window.setSyncCode || !window.reinitStorage) return;
    window.setSyncCode(syncCode);
    setSyncMsg("Connexion...");
    const mode = await window.reinitStorage();
    if (mode !== "firebase") {
      const why = window.STORAGE_REASON ? window.STORAGE_REASON() : "";
      setSyncMsg("Toujours en local — " + (why || "cause inconnue"));
      return;
    }
    try {
      const res = await window.storage.get("appstate", false);
      if (res?.value) {
        const data = JSON.parse(res.value);
        setGoal(data.goal || null);
        setSessions(data.sessions || []);
        setEvaluations(data.evaluations || {});
        if (data.weightKg) setWeightKg(data.weightKg);
        if (data.targetWeight) setTargetWeight(data.targetWeight);
        if (data.products) setProducts({ ...DEFAULT_PRODUCTS, ...data.products });
        setEditingGoal(!data.goal);
        setSyncMsg("Synchronisé — données récupérées depuis le cloud.");
      } else {
        setSyncMsg("Synchronisé — cet espace était vide, tes données locales y seront envoyées.");
      }
      setStorageOk(true);
    } catch (e) {
      setSyncMsg("Connecté, mais lecture impossible : " + String(e).slice(0, 50));
    }
    setTimeout(() => setSyncMsg(""), 8000);
  };

  const exportBackup = () => {
    setBackupText(JSON.stringify({ goal, sessions, evaluations, weightKg, targetWeight, products }));
    setBackupStatus("Copie ce texte et garde-le quelque part.");
  };

  const restoreBackup = () => {
    try {
      const data = JSON.parse(backupText);
      setGoal(data.goal || null);
      setSessions(data.sessions || []);
      setEvaluations(data.evaluations || {});
      if (data.weightKg) setWeightKg(data.weightKg);
      if (data.targetWeight) setTargetWeight(data.targetWeight);
      if (data.products) setProducts({ ...DEFAULT_PRODUCTS, ...data.products });
      setEditingGoal(!data.goal);
      setShowRestore(false);
      setTab("plan");
      setBackupStatus("Sauvegarde restaurée.");
    } catch (e) {
      setBackupStatus("Texte invalide — vérifie le copier-coller.");
    }
  };

  /**
   * Import texte. Une séance par ligne, format :
   *   AAAA-MM-JJ ; distance_km ; dplus_m ; duree_min ; ressenti(1-5)
   * Les champs vides sont tolérés :  2026-08-12 ; 12.4 ; 380 ;  ; 3
   * Si une séance planifiée existe à ±2 jours, elle est marquée réalisée
   * avec ces valeurs ; sinon une nouvelle séance réalisée est créée.
   */
  const runImport = () => {
    const lines = importText.split("\n").map(l => l.trim()).filter(Boolean);
    if (lines.length === 0) { setImportStatus("Rien à importer."); return; }

    let created = 0, skipped = 0;
    const updated = [...sessions];

    for (const line of lines) {
      const parts = line.split(";").map(p => p.trim());
      const [dateStr, distStr, dplusStr, dureeStr, feelStr, fcStr, fcMaxStr, cadStr] = parts;
      if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) { skipped++; continue; }

      const actual = {
        distance: distStr ? Number(distStr) : null,
        dplus: dplusStr ? Number(dplusStr) : null,
        duree: dureeStr ? Number(dureeStr) : null,
        feeling: feelStr ? Number(feelStr) : null,
        fc: fcStr ? Number(fcStr) : null,
        fcMax: fcMaxStr ? Number(fcMaxStr) : null,
        cadence: cadStr ? Number(cadStr) : null,
      };

      // Aucun rapprochement automatique : chaque ligne devient une séance
      // distincte. Pour rattacher une activité à une séance du plan, on
      // utilise le bouton « Importer » en face de la séance voulue.
      updated.push({
        id: uid(), type: "fonda", date: dateStr,
        distance: actual.distance, dplus: actual.dplus, duree: actual.duree,
        notes: "", done: true, actual, generated: false,
      });
      created++;
    }

    setSessions(updated);
    setImportText("");
    setImportStatus(`${created} séance(s) ajoutée(s)${skipped ? `, ${skipped} ignorée(s)` : ""}. Change leur type dans l'historique si besoin.`);
    setTimeout(() => setImportStatus(""), 6000);
  };

  /**
   * Recalcule les séances des semaines FUTURES avec les formats actuels,
   * en conservant intégralement l'historique : séances réalisées, séances
   * ajoutées à la main, et semaine en cours (déjà entamée).
   */
  const refreshFuture = () => {
    if (!goal) return;
    const currentWeek = toISO(isoWeekStart(new Date()));
    const kept = sessions.filter(s =>
      !s.generated || s.done || (sessionWeek(s) || "") <= currentWeek
    );
    const all = generatePlan(goal);
    const future = all.filter(s => s.weekStart > currentWeek);

    // Comble les manques de la semaine en cours : une séance supprimée par
    // erreur réapparaît, sans dupliquer celles déjà présentes. On compare
    // par type et par nombre, deux séances du même type pouvant coexister.
    const present = {};
    sessions.filter(s => s.generated && sessionWeek(s) === currentWeek)
      .forEach(s => { present[s.type] = (present[s.type] || 0) + 1; });
    const missing = [];
    all.filter(s => s.weekStart === currentWeek).forEach(s => {
      if ((present[s.type] || 0) > 0) present[s.type] -= 1;
      else missing.push(s);
    });

    setSessions([...kept, ...missing, ...future]);
    setRefreshMsg(
      `${future.length} séances à venir mises à jour`
      + (missing.length ? ` · ${missing.length} rétablie(s) cette semaine` : "")
      + " · historique conservé"
    );
    setTimeout(() => setRefreshMsg(""), 5000);
  };

  const saveGoal = (g) => {
    const generated = generatePlan(g);
    const manual = sessions.filter(s => !s.generated);
    setGoal(g);
    setSessions([...manual, ...generated]);
    setEvaluations({});
    setEditingGoal(false);
  };

  const addSession = (s) => setSessions(prev => [...prev, s]);
  const deleteSession = (id) => setSessions(prev => prev.filter(s => s.id !== id));
  const toggleSession = (id, patch) => setSessions(prev => prev.map(s => s.id === id ? { ...s, ...patch } : s));

  const now = new Date();
  const progress = goal ? Math.min(1, Math.max(0, 1 - (new Date(goal.raceDate) - now) / (new Date(goal.raceDate) - addDays(now, -90)))) : 0;
  const daysLeft = goal ? Math.max(0, Math.ceil((new Date(goal.raceDate) - now) / 86400000)) : 0;

  const upcoming = sessions.filter(s => !s.done).sort((a, b) => (sessionWeek(a) || "").localeCompare(sessionWeek(b) || "") || (a.order ?? 99) - (b.order ?? 99));
  const past = sessions.filter(s => s.done).sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  return (
    <div className="min-h-screen w-full" style={{ background: "var(--bg)" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap');
        * { font-family: 'IBM Plex Sans', sans-serif; }
        input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
      `}</style>

      <div className="max-w-md lg:max-w-5xl mx-auto px-4 py-5 space-y-5">
        <div className="space-y-5 lg:space-y-0 lg:grid lg:grid-cols-[1.5fr_1fr] lg:gap-5 lg:items-stretch">
          <ElevationHero goal={goal} progress={progress} daysLeft={daysLeft} />
          {goal && !editingGoal && <WeekRings sessions={sessions} />}
        </div>

        <div className="flex items-center justify-between px-1 gap-2">
          <span className="text-xs" style={{ color: storageOk ? "var(--muted)" : "var(--accent2)", fontFamily: "'JetBrains Mono', monospace" }}>
            {storageOk ? "● " : "▲ "}{storageMsg || "sauvegarde auto"}
          </span>
          <div className="flex gap-1 rounded-lg p-0.5 shrink-0" style={{ background: "var(--surface2)" }}>
            {[["dark", "Sombre"], ["light", "Clair"], ["eink", "Liseuse"]].map(([k, label]) => (
              <button key={k} onClick={() => setTheme(k)} className="px-2 py-1 rounded-md text-xs"
                style={{ background: theme === k ? "var(--accent)" : "transparent",
                         color: theme === k ? "var(--bg)" : "var(--muted2)" }}>
                {label}
              </button>
            ))}
          </div>
        </div>

        {goal && !editingGoal && (
          <button onClick={() => setEditingGoal(true)} className="text-xs px-3 py-1.5 rounded-lg" style={{ background: "var(--surface2)", color: "var(--green)" }}>
            Modifier l'objectif
          </button>
        )}

        {(editingGoal || !goal) && (
          <div className="lg:max-w-xl space-y-5">
            <div className="rounded-xl p-4 space-y-3" style={{ background: "var(--surface)", border: "1px solid var(--border)" }}>
              <button onClick={() => setShowRestore(v => !v)} className="w-full flex items-center justify-between">
                <span className="text-sm uppercase tracking-wider" style={{ color: "var(--green)", fontFamily: "'JetBrains Mono', monospace" }}>
                  Restaurer une sauvegarde
                </span>
                <span style={{ color: "var(--muted)" }}>{showRestore ? "▾" : "▸"}</span>
              </button>
              {showRestore && (
                <>
                  <p className="text-xs" style={{ color: "var(--muted2)" }}>
                    Colle ici le texte de sauvegarde généré précédemment pour retrouver ton plan et ton historique.
                  </p>
                  <textarea value={backupText} onChange={e => setBackupText(e.target.value)} rows={4}
                    className="w-full rounded-lg px-3 py-2 text-xs outline-none"
                    style={{ background: "var(--surface2)", color: "var(--text)", border: "1px solid var(--border)", fontFamily: "'JetBrains Mono', monospace" }}
                    placeholder='{"goal":...}' />
                  <button onClick={restoreBackup} className="w-full rounded-lg py-2.5 text-sm font-medium" style={{ background: "var(--blue)", color: "var(--bg)" }}>
                    Restaurer
                  </button>
                  {backupStatus && <p className="text-xs text-center" style={{ color: "var(--green)" }}>{backupStatus}</p>}
                </>
              )}
            </div>
            <GoalWizard initial={goal} onSave={saveGoal} />
          </div>
        )}

        {goal && !editingGoal && (
          <>
            <div className="flex gap-1 rounded-xl p-1" style={{ background: "var(--surface2)" }}>
              {[["plan", "Plan"], ["importer", "Importer"], ["ajouter", "Ajouter"], ["nutrition", "Nutrition"], ["stats", "Stats"], ["historique", "Historique"]].map(([k, label]) => (
                <button key={k} onClick={() => setTab(k)} className="flex-1 py-2 rounded-lg text-xs"
                  style={{ background: tab === k ? "var(--accent)" : "transparent", color: tab === k ? "var(--bg)" : "var(--muted2)", fontFamily: "'Space Grotesk', sans-serif" }}>
                  {label}
                </button>
              ))}
            </div>

            {tab === "plan" && (
              <>
                <div className="flex items-center gap-2 flex-wrap">
                  <button onClick={refreshFuture} className="text-xs px-3 py-1.5 rounded-lg"
                    style={{ background: "var(--border)", color: "var(--text)" }}>
                    ↻ Actualiser les semaines à venir
                  </button>
                  {refreshMsg && <span className="text-xs" style={{ color: "var(--green)" }}>{refreshMsg}</span>}
                </div>
                <PlanView sessions={upcoming} evaluations={evaluations} onToggle={toggleSession} onDelete={deleteSession}
                onSaveNotes={saveNotes} vma={goal?.vma} products={products} />
              </>
            )}

            {tab === "importer" && (
              <div className="space-y-4 lg:space-y-0 lg:grid lg:grid-cols-2 lg:gap-4 lg:items-start">
                {!storageOk && (
                  <div className="rounded-lg px-3 py-2 text-xs lg:col-span-2" style={{ background: "var(--warnbg)", color: "var(--accent2)", border: "1px solid var(--warnborder)" }}>
                    La sauvegarde automatique ne fonctionne pas dans ce contexte. Utilise la sauvegarde manuelle ci-dessous avant de fermer l'app.
                  </div>
                )}
                <div className="rounded-xl p-4 space-y-3" style={{ background: "var(--surface)", border: "1px solid var(--border)" }}>
                  <p className="text-sm uppercase tracking-wider" style={{ color: "var(--green)", fontFamily: "'JetBrains Mono', monospace" }}>
                    Importer des séances réalisées
                  </p>
                  <p className="text-xs leading-relaxed" style={{ color: "var(--muted2)" }}>
                    Chaque ligne crée une séance distincte dans l'historique — aucun rattachement
                    automatique au plan. Pour rattacher une activité à une séance prévue, utilise
                    le bouton <span style={{ color: "var(--accent)" }}>Importer</span> en face de cette séance.
                  </p>
                  <p className="text-xs leading-relaxed" style={{ color: "var(--muted2)" }}>
                    Une séance par ligne :<br />
                    <span style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--blue)" }}>
                      date ; km ; D+ ; minutes ; ressenti ; FC moy ; FC max ; cadence
                    </span><br />
                    Exemple : <span style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--blue)" }}>2026-08-12 ; 12.4 ; 380 ; 78 ; 3 ; 148 ; 172 ; 80</span><br />
                    Les champs vides sont acceptés. Une séance planifiée à ±2 jours est automatiquement rapprochée.
                  </p>
                  <textarea value={importText} onChange={e => setImportText(e.target.value)} rows={6}
                    className="w-full rounded-lg px-3 py-2 text-sm outline-none"
                    style={{ background: "var(--surface2)", color: "var(--text)", border: "1px solid var(--border)", fontFamily: "'JetBrains Mono', monospace" }}
                    placeholder={"2026-08-12 ; 12.4 ; 380 ; 78 ; 3\n2026-08-14 ; 8 ; 90 ; 45 ; 2"} />
                  <button onClick={runImport} className="w-full rounded-lg py-2.5 text-sm font-medium" style={{ background: "var(--accent)", color: "var(--bg)" }}>
                    Importer
                  </button>
                  {importStatus && <p className="text-xs text-center" style={{ color: "var(--green)" }}>{importStatus}</p>}
                </div>

                <div className="rounded-xl p-4 space-y-3" style={{ background: "var(--surface)", border: "1px solid var(--border)" }}>
                  <p className="text-sm uppercase tracking-wider" style={{ color: "var(--green)", fontFamily: "'JetBrains Mono', monospace" }}>
                    Synchronisation entre appareils
                  </p>
                  <p className="text-xs leading-relaxed" style={{ color: "var(--muted2)" }}>
                    Saisis le <span style={{ color: "var(--text)" }}>même code</span> sur ton téléphone et
                    ton ordinateur : ils partageront alors les mêmes données. Sans code, tout reste
                    sur cet appareil.
                  </p>
                  <div className="flex gap-2">
                    <input type="text" value={syncCode} onChange={e => setSyncCode(e.target.value)}
                      placeholder="ex. mickael-trail-2026"
                      className="flex-1 rounded-lg px-3 py-2 text-sm outline-none"
                      style={{ background: "var(--surface2)", color: "var(--text)", border: "1px solid var(--border)", fontFamily: "'JetBrains Mono', monospace" }} />
                    <button onClick={applySyncCode} className="rounded-lg px-3 text-sm" style={{ background: "var(--blue)", color: "var(--bg)" }}>
                      Activer
                    </button>
                  </div>
                  {syncMsg && <p className="text-xs" style={{ color: "var(--green)" }}>{syncMsg}</p>}
                  <p className="text-xs leading-relaxed" style={{ color: "var(--muted)" }}>
                    Choisis un code long et peu devinable : toute personne connaissant l'adresse du
                    site et ce code pourrait accéder à tes données.
                  </p>
                </div>

                <div className="rounded-xl p-4 space-y-3" style={{ background: "var(--surface)", border: "1px solid var(--border)" }}>
                  <p className="text-sm uppercase tracking-wider" style={{ color: "var(--green)", fontFamily: "'JetBrains Mono', monospace" }}>
                    Sauvegarde manuelle
                  </p>
                  <p className="text-xs" style={{ color: "var(--muted2)" }}>
                    Génère un texte contenant tout ton plan. Garde-le (note, mail, message) : si tu perds tes données, recolle-le ici et clique Restaurer.
                  </p>
                  <div className="flex gap-2">
                    <button onClick={exportBackup} className="flex-1 rounded-lg py-2 text-sm" style={{ background: "var(--border)", color: "var(--text)" }}>
                      Générer
                    </button>
                    <button onClick={restoreBackup} className="flex-1 rounded-lg py-2 text-sm" style={{ background: "var(--blue)", color: "var(--bg)" }}>
                      Restaurer
                    </button>
                  </div>
                  <textarea value={backupText} onChange={e => setBackupText(e.target.value)} rows={4}
                    className="w-full rounded-lg px-3 py-2 text-xs outline-none"
                    style={{ background: "var(--surface2)", color: "var(--text)", border: "1px solid var(--border)", fontFamily: "'JetBrains Mono', monospace" }}
                    placeholder="Le texte de sauvegarde apparaîtra ici" />
                  {backupStatus && <p className="text-xs text-center" style={{ color: "var(--green)" }}>{backupStatus}</p>}
                </div>
              </div>
            )}
            {tab === "ajouter" && (
              <div className="lg:max-w-xl">
                <SessionForm onAdd={addSession} products={products} />
              </div>
            )}
            {tab === "nutrition" && (
              <NutritionTab goal={goal} sessions={sessions} weightKg={weightKg} onWeightChange={setWeightKg} targetWeight={targetWeight} onTargetChange={setTargetWeight} products={products} onProductsChange={setProducts} />
            )}
            {tab === "stats" && <Stats sessions={sessions} />}
            {tab === "historique" && (
              <div className="space-y-3 lg:space-y-0 lg:grid lg:grid-cols-2 lg:gap-3 lg:items-start">
                {past.length === 0 && <p className="text-sm text-center py-6 lg:col-span-2" style={{ color: "var(--muted)" }}>Pas encore de séance réalisée.</p>}
                {past.map(s => <SessionRow key={s.id} s={s} onToggle={toggleSession} onDelete={deleteSession} onSaveNotes={saveNotes} vma={goal?.vma} products={products} />)}
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}


try {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
} catch (err) {
  showFatal(err && err.message ? err.message : err);
}
</script>
</body>
</html>
