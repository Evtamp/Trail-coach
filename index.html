const STATS_PERIODS = [["semaine", "Semaine"], ["mois", "Mois"], ["annee", "Année"]];
const STATS_PERIOD_TITLE = { semaine: "Volume hebdo course (km)", mois: "Volume mensuel course (km) — depuis janvier", annee: "Volume annuel course (km)" };

// Infobulle personnalisée du graphique de volume : distance ET dénivelé
// (réalisé / planifié) pour la période survolée, quelle que soit la vue
// (semaine, mois ou année).
function VolumeTooltip({ active, payload, label }) {
  if (!active || !payload || !payload.length) return null;
  const d = payload[0]?.payload;
  if (!d) return null;
  return (
    <div className="rounded-lg px-3 py-2 text-xs space-y-1" style={{ background: "#14201C", border: "1px solid #2C3A32", color: "#EDE7D9" }}>
      <p style={{ color: "#7A8B5E", fontFamily: "'JetBrains Mono', monospace" }}>{label}</p>
      <p style={{ fontFamily: "'JetBrains Mono', monospace" }}>
        <span style={{ color: "#9CAA9E" }}>Distance </span>
        <span style={{ color: "#C1622B" }}>{d.realise}</span>
        <span style={{ color: "#5A6259" }}> / {d.planifie} km</span>
      </p>
      <p style={{ fontFamily: "'JetBrains Mono', monospace" }}>
        <span style={{ color: "#9CAA9E" }}>D+ </span>
        <span style={{ color: "#B0863C" }}>{d.dplusRealise}</span>
        <span style={{ color: "#5A6259" }}> / {d.dplusPlanifie} m</span>
      </p>
    </div>
  );
}

function Stats({ sessions }) {
  const runSessions = sessions.filter(s => !isCross(s.type));
  const crossSessions = sessions.filter(s => isCross(s.type) && s.done);
  const [period, setPeriod] = useState("mois");

  // Regroupe le volume course par semaine, mois ou année, selon la période
  // choisie. "mois" se limite à l'année en cours (depuis janvier), en
  // complétant les mois sans séance par des barres à zéro pour garder une
  // frise continue jusqu'au mois courant.
  const chartData = useMemo(() => {
    const map = new Map();
    runSessions.forEach(s => {
      const wk = sessionWeek(s);
      if (!wk) return;
      const key = period === "semaine" ? wk : period === "annee" ? wk.slice(0, 4) : wk.slice(0, 7);
      if (!map.has(key)) map.set(key, { key, planifie: 0, realise: 0, dplusPlanifie: 0, dplusRealise: 0 });
      const e = map.get(key);
      // planifié = ce que le plan prévoyait ; réalisé = toute la course faite,
      // y compris les séances ajoutées hors plan
      if (s.generated) {
        e.planifie += s.distance || 0;
        e.dplusPlanifie += s.dplus || 0;
      }
      if (s.done) {
        e.realise += (s.actual?.distance ?? s.distance) || 0;
        e.dplusRealise += (s.actual?.dplus ?? s.dplus) || 0;
      }
    });

    let keys = [...map.keys()];

    if (period === "mois") {
      const now = new Date();
      const year = String(now.getFullYear());
      const monthsThisYear = new Set(keys.filter(k => k.startsWith(year)));
      for (let m = 0; m <= now.getMonth(); m++) monthsThisYear.add(`${year}-${String(m + 1).padStart(2, "0")}`);
      keys = [...monthsThisYear];
    }

    keys.sort();
    if (period === "semaine") keys = keys.slice(-10);

    return keys.map(k => {
      const e = map.get(k) || { key: k, planifie: 0, realise: 0, dplusPlanifie: 0, dplusRealise: 0 };
      const label = period === "semaine" ? fmtDate(k)
        : period === "annee" ? k
        : new Date(`${k}-01`).toLocaleDateString("fr-FR", { month: "short" }).replace(".", "");
      return {
        ...e, label,
        planifie: Math.round(e.planifie), realise: Math.round(e.realise),
        dplusPlanifie: Math.round(e.dplusPlanifie), dplusRealise: Math.round(e.dplusRealise),
      };
    });
  }, [sessions, period]);

  const planned = sessions.filter(s => s.generated);
  const totalPlanned = planned.length;
  const totalDone = planned.filter(s => s.done).length;
  const compliance = totalPlanned ? Math.round((totalDone / totalPlanned) * 100) : 0;
  const dplusDone = runSessions.filter(s => s.done).reduce((a, s) => a + (s.actual?.dplus ?? s.dplus ?? 0), 0);
  const cardStyle = { background: "#182420", border: "1px solid #2C3A32" };

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-3 gap-3">
        <div className="rounded-xl p-3 text-center" style={cardStyle}>
          <p className="text-2xl" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#EDE7D9" }}>{compliance}%</p>
          <p className="text-xs mt-1" style={{ color: "#7A8B5E" }}>séances faites</p>
        </div>
        <div className="rounded-xl p-3 text-center" style={cardStyle}>
          <p className="text-2xl" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#EDE7D9" }}>{dplusDone}</p>
          <p className="text-xs mt-1" style={{ color: "#7A8B5E" }}>m D+ cumulés</p>
        </div>
        <div className="rounded-xl p-3 text-center" style={cardStyle}>
          <p className="text-2xl" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#EDE7D9" }}>{totalDone}/{totalPlanned}</p>
          <p className="text-xs mt-1" style={{ color: "#7A8B5E" }}>séances</p>
        </div>
      </div>
      <div className="rounded-xl p-4" style={cardStyle}>
        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
          <p className="text-xs uppercase tracking-wider" style={{ color: "#7A8B5E", fontFamily: "'JetBrains Mono', monospace" }}>
            {STATS_PERIOD_TITLE[period]}
          </p>
          <div className="flex gap-1 rounded-lg p-0.5 shrink-0" style={{ background: "#1C2B24" }}>
            {STATS_PERIODS.map(([k, label]) => (
              <button key={k} onClick={() => setPeriod(k)}
                className="px-2.5 py-1 rounded-md text-xs cursor-pointer transition-colors hover:opacity-90"
                style={{ background: period === k ? "#C1622B" : "transparent", color: period === k ? "#14201C" : "#9CAA9E", fontFamily: "'Space Grotesk', sans-serif" }}>
                {label}
              </button>
            ))}
          </div>
        </div>
        {!CHARTS_OK ? (
          <div className="space-y-1">
            {chartData.map(w => (
              <div key={w.key} className="flex items-center justify-between text-xs" style={{ color: "#9CAA9E" }}>
                <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>{w.label}</span>
                <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>
                  <span style={{ color: "#5A6259" }}>{w.planifie}</span> / <span style={{ color: "#C1622B" }}>{w.realise}</span> km
                  <span style={{ color: "#5A6259" }}> · </span>
                  <span style={{ color: "#5A6259" }}>{w.dplusPlanifie}</span> / <span style={{ color: "#B0863C" }}>{w.dplusRealise}</span> m D+
                </span>
              </div>
            ))}
          </div>
        ) : (
        <div className="w-full h-[180px] lg:h-[280px]">
          <ResponsiveContainer>
            <BarChart data={chartData}>
              <CartesianGrid strokeDasharray="3 3" stroke="#2C3A32" vertical={false} />
              <XAxis dataKey="label" stroke="#5A6259" fontSize={11} />
              <YAxis stroke="#5A6259" fontSize={11} />
              <Tooltip content={<VolumeTooltip />} cursor={{ fill: "#22302A" }} />
              <Bar dataKey="planifie" fill="#2C3A32" radius={[4, 4, 0, 0]} name="Planifié" />
              <Bar dataKey="realise" fill="#C1622B" radius={[4, 4, 0, 0]} name="Réalisé" />
            </BarChart>
          </ResponsiveContainer>
        </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [goal, setGoal] = useState(null);
  const [sessions, setSessions] = useState([]);
  const [evaluations, setEvaluations] = useState({});
  const [tab, setTab] = useState("plan");
  const [editingGoal, setEditingGoal] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [importText, setImportText] = useState("");
  const [importStatus, setImportStatus] = useState("");
  const [storageOk, setStorageOk] = useState(true);
  const [storageMsg, setStorageMsg] = useState("");
  const [backupText, setBackupText] = useState("");
  const [backupStatus, setBackupStatus] = useState("");
  const [showRestore, setShowRestore] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        if (window.__storageReady) await window.__storageReady;
        if (!window.storage || typeof window.storage.get !== "function") {
          setStorageOk(false);
          setStorageMsg("stockage indisponible");
          setEditingGoal(true);
          setLoaded(true);
          return;
        }
        const res = await window.storage.get("appstate", false);
        if (res?.value) {
          setStorageMsg(`données rechargées (${window.STORAGE_MODE ? window.STORAGE_MODE() : "local"})`);
          const data = JSON.parse(res.value);
          setGoal(data.goal || null);
          setSessions(data.sessions || []);
          setEvaluations(data.evaluations || {});
          if (!data.goal) setEditingGoal(true);
        } else {
          setEditingGoal(true);
        }
      } catch (e) { setEditingGoal(true); }
      setLoaded(true);
    })();
  }, []);

  // adaptive re-evaluation on load / whenever sessions change
  useEffect(() => {
    if (!loaded || sessions.length === 0) return;
    const { sessions: adj, evaluations: newEval } = evaluateAndAdjust(sessions, evaluations);
    if (JSON.stringify(newEval) !== JSON.stringify(evaluations)) {
      setSessions(adj);
      setEvaluations(newEval);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, sessions.length]);

  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        if (!window.storage || typeof window.storage.set !== "function") {
          setStorageOk(false);
          setStorageMsg("stockage indisponible");
          return;
        }
        const r = await window.storage.set("appstate", JSON.stringify({ goal, sessions, evaluations }), false);
        const ok = r !== null && r !== undefined;
        setStorageOk(ok);
        setStorageMsg(ok ? `${window.STORAGE_MODE ? window.STORAGE_MODE() : "local"} · sauvegardé ${new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}` : "échec de sauvegarde");
      } catch (e) {
        setStorageOk(false);
        setStorageMsg("erreur : " + String(e).slice(0, 60));
      }
    })();
  }, [goal, sessions, evaluations, loaded]);

  const saveNotes = (id, notes) => setSessions(prev => prev.map(s => s.id === id ? { ...s, notes } : s));

  const exportBackup = () => {
    setBackupText(JSON.stringify({ goal, sessions, evaluations }));
    setBackupStatus("Copie ce texte et garde-le quelque part.");
  };

  const restoreBackup = () => {
    try {
      const data = JSON.parse(backupText);
      setGoal(data.goal || null);
      setSessions(data.sessions || []);
      setEvaluations(data.evaluations || {});
      setEditingGoal(!data.goal);
      setShowRestore(false);
      setTab("plan");
      setBackupStatus("Sauvegarde restaurée.");
    } catch (e) {
      setBackupStatus("Texte invalide — vérifie le copier-coller.");
    }
  };

  /**
   * Import texte. Une séance par ligne, format :
   *   AAAA-MM-JJ ; distance_km ; dplus_m ; duree_min ; ressenti(1-5)
   * Les champs vides sont tolérés :  2026-08-12 ; 12.4 ; 380 ;  ; 3
   * Si une séance planifiée existe à ±2 jours, elle est marquée réalisée
   * avec ces valeurs ; sinon une nouvelle séance réalisée est créée.
   */
  const runImport = () => {
    const lines = importText.split("\n").map(l => l.trim()).filter(Boolean);
    if (lines.length === 0) { setImportStatus("Rien à importer."); return; }

    let matched = 0, created = 0, skipped = 0;
    const updated = [...sessions];

    for (const line of lines) {
      const parts = line.split(";").map(p => p.trim());
      const [dateStr, distStr, dplusStr, dureeStr, feelStr, fcStr, fcMaxStr, cadStr] = parts;
      if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) { skipped++; continue; }

      const actual = {
        distance: distStr ? Number(distStr) : null,
        dplus: dplusStr ? Number(dplusStr) : null,
        duree: dureeStr ? Number(dureeStr) : null,
        feeling: feelStr ? Number(feelStr) : null,
        fc: fcStr ? Number(fcStr) : null,
        fcMax: fcMaxStr ? Number(fcMaxStr) : null,
        cadence: cadStr ? Number(cadStr) : null,
      };

      // Cherche dans la MÊME semaine une séance planifiée non encore validée.
      // Parmi celles-ci, prend celle dont la distance prévue est la plus proche
      // de la distance réalisée (une sortie de 22 km se rapproche de la longue,
      // pas du fractionné).
      const targetWeek = toISO(isoWeekStart(dateStr));
      let bestIdx = -1, bestScore = Infinity;
      updated.forEach((s, i) => {
        if (s.done) return;
        if (sessionWeek(s) !== targetWeek) return;
        const score = actual.distance != null && s.distance != null
          ? Math.abs(s.distance - actual.distance)
          : 0;
        if (score < bestScore) { bestScore = score; bestIdx = i; }
      });

      if (bestIdx >= 0) {
        updated[bestIdx] = { ...updated[bestIdx], done: true, actual, date: dateStr };
        matched++;
      } else {
        updated.push({
          id: uid(), type: "fonda", date: dateStr,
          distance: actual.distance, dplus: actual.dplus, duree: actual.duree,
          notes: "", done: true, actual, generated: false,
        });
        created++;
      }
    }

    setSessions(updated);
    setImportText("");
    setImportStatus(`${matched} séance(s) rapprochée(s), ${created} ajoutée(s)${skipped ? `, ${skipped} ignorée(s)` : ""}.`);
    setTimeout(() => setImportStatus(""), 6000);
  };

  const saveGoal = (g) => {
    const generated = generatePlan(g);
    const manual = sessions.filter(s => !s.generated);
    setGoal(g);
    setSessions([...manual, ...generated]);
    setEvaluations({});
    setEditingGoal(false);
  };

  const addSession = (s) => setSessions(prev => [...prev, s]);
  const deleteSession = (id) => setSessions(prev => prev.filter(s => s.id !== id));
  const toggleSession = (id, patch) => setSessions(prev => prev.map(s => s.id === id ? { ...s, ...patch } : s));

  const now = new Date();
  const progress = goal ? Math.min(1, Math.max(0, 1 - (new Date(goal.raceDate) - now) / (new Date(goal.raceDate) - addDays(now, -90)))) : 0;
  const daysLeft = goal ? Math.max(0, Math.ceil((new Date(goal.raceDate) - now) / 86400000)) : 0;

  const upcoming = sessions.filter(s => !s.done).sort((a, b) => (sessionWeek(a) || "").localeCompare(sessionWeek(b) || "") || (a.order ?? 99) - (b.order ?? 99));
  const past = sessions.filter(s => s.done).sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  return (
    <div className="min-h-screen w-full" style={{ background: "#14201C" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap');
        * { font-family: 'IBM Plex Sans', sans-serif; }
        input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
      `}</style>

      <div className="max-w-md mx-auto px-4 py-5 lg:max-w-6xl lg:px-8 lg:py-8">
        <div className="space-y-5 lg:space-y-0 lg:grid lg:grid-cols-[380px_minmax(0,1fr)] lg:gap-8 lg:items-start">

          <div className="space-y-5 lg:sticky lg:top-8">
            <ElevationHero goal={goal} progress={progress} daysLeft={daysLeft} />

            <div className="flex items-center justify-between px-1">
              <span className="text-xs" style={{ color: storageOk ? "#5A6259" : "#D9793C", fontFamily: "'JetBrains Mono', monospace" }}>
                {storageOk ? "● " : "▲ "}{storageMsg || "sauvegarde auto"} · build laps
              </span>
              {!storageOk && (
                <span className="text-xs" style={{ color: "#D9793C" }}>pense à sauvegarder à la main</span>
              )}
            </div>

            {goal && !editingGoal && <WeekRings sessions={sessions} />}

            {goal && !editingGoal && (
              <button onClick={() => setEditingGoal(true)} className="text-xs px-3 py-1.5 rounded-lg cursor-pointer hover:opacity-90 transition-opacity" style={{ background: "#1C2B24", color: "#7A8B5E" }}>
                Modifier l'objectif
              </button>
            )}
          </div>

          <div className="space-y-5">
            {(editingGoal || !goal) && (
              <>
                <div className="rounded-xl p-4 space-y-3" style={{ background: "#182420", border: "1px solid #2C3A32" }}>
                  <button onClick={() => setShowRestore(v => !v)} className="w-full flex items-center justify-between cursor-pointer">
                    <span className="text-sm uppercase tracking-wider" style={{ color: "#7A8B5E", fontFamily: "'JetBrains Mono', monospace" }}>
                      Restaurer une sauvegarde
                    </span>
                    <span style={{ color: "#5A6259" }}>{showRestore ? "▾" : "▸"}</span>
                  </button>
                  {showRestore && (
                    <>
                      <p className="text-xs" style={{ color: "#9CAA9E" }}>
                        Colle ici le texte de sauvegarde généré précédemment pour retrouver ton plan et ton historique.
                      </p>
                      <textarea value={backupText} onChange={e => setBackupText(e.target.value)} rows={4}
                        className="w-full rounded-lg px-3 py-2 text-xs outline-none"
                        style={{ background: "#1C2B24", color: "#EDE7D9", border: "1px solid #2C3A32", fontFamily: "'JetBrains Mono', monospace" }}
                        placeholder='{"goal":...}' />
                      <button onClick={restoreBackup} className="w-full rounded-lg py-2.5 text-sm font-medium cursor-pointer hover:opacity-90 transition-opacity" style={{ background: "#5C7A99", color: "#14201C" }}>
                        Restaurer
                      </button>
                      {backupStatus && <p className="text-xs text-center" style={{ color: "#7A8B5E" }}>{backupStatus}</p>}
                    </>
                  )}
                </div>
                <GoalWizard initial={goal} onSave={saveGoal} />
              </>
            )}

            {goal && !editingGoal && (
              <>
                <div className="flex gap-1 rounded-xl p-1" style={{ background: "#1C2B24" }}>
                  {[["plan", "Plan"], ["importer", "Importer"], ["ajouter", "Ajouter"], ["stats", "Stats"], ["historique", "Historique"]].map(([k, label]) => (
                    <button key={k} onClick={() => setTab(k)} className="flex-1 py-2 rounded-lg text-xs cursor-pointer transition-colors hover:opacity-90"
                      style={{ background: tab === k ? "#C1622B" : "transparent", color: tab === k ? "#14201C" : "#9CAA9E", fontFamily: "'Space Grotesk', sans-serif" }}>
                      {label}
                    </button>
                  ))}
                </div>

                {tab === "plan" && (
                  <PlanView sessions={upcoming} evaluations={evaluations} onToggle={toggleSession} onDelete={deleteSession}
                    onSaveNotes={saveNotes} vma={goal?.vma} />
                )}

                {tab === "importer" && (
                  <div className="space-y-4 lg:grid lg:grid-cols-2 lg:gap-4 lg:space-y-0">
                    <div className="space-y-4">
                      {!storageOk && (
                        <div className="rounded-lg px-3 py-2 text-xs" style={{ background: "#2A2018", color: "#D9793C", border: "1px solid #3A2C1C" }}>
                          La sauvegarde automatique ne fonctionne pas dans ce contexte. Utilise la sauvegarde manuelle ci-dessous avant de fermer l'app.
                        </div>
                      )}
                      <div className="rounded-xl p-4 space-y-3" style={{ background: "#182420", border: "1px solid #2C3A32" }}>
                        <p className="text-sm uppercase tracking-wider" style={{ color: "#7A8B5E", fontFamily: "'JetBrains Mono', monospace" }}>
                          Importer des séances réalisées
                        </p>
                        <p className="text-xs leading-relaxed" style={{ color: "#D9793C" }}>
                          Import en lot : le rapprochement se fait par semaine et par distance approchante, il peut se tromper de séance. Pour être sûr, utilise le bouton <span style={{ color: "#C1622B" }}>Importer</span> en face de la séance voulue.
                        </p>
                        <p className="text-xs leading-relaxed" style={{ color: "#9CAA9E" }}>
                          Une séance par ligne :<br />
                          <span style={{ fontFamily: "'JetBrains Mono', monospace", color: "#5C7A99" }}>
                            date ; km ; D+ ; minutes ; ressenti ; FC moy ; FC max ; cadence
                          </span><br />
                          Exemple : <span style={{ fontFamily: "'JetBrains Mono', monospace", color: "#5C7A99" }}>2026-08-12 ; 12.4 ; 380 ; 78 ; 3 ; 148 ; 172 ; 80</span><br />
                          Les champs vides sont acceptés. Une séance planifiée à ±2 jours est automatiquement rapprochée.
                        </p>
                        <textarea value={importText} onChange={e => setImportText(e.target.value)} rows={6}
                          className="w-full rounded-lg px-3 py-2 text-sm outline-none"
                          style={{ background: "#1C2B24", color: "#EDE7D9", border: "1px solid #2C3A32", fontFamily: "'JetBrains Mono', monospace" }}
                          placeholder={"2026-08-12 ; 12.4 ; 380 ; 78 ; 3\n2026-08-14 ; 8 ; 90 ; 45 ; 2"} />
                        <button onClick={runImport} className="w-full rounded-lg py-2.5 text-sm font-medium cursor-pointer hover:opacity-90 transition-opacity" style={{ background: "#C1622B", color: "#14201C" }}>
                          Importer
                        </button>
                        {importStatus && <p className="text-xs text-center" style={{ color: "#7A8B5E" }}>{importStatus}</p>}
                      </div>
                    </div>

                    <div className="rounded-xl p-4 space-y-3 lg:self-start" style={{ background: "#182420", border: "1px solid #2C3A32" }}>
                      <p className="text-sm uppercase tracking-wider" style={{ color: "#7A8B5E", fontFamily: "'JetBrains Mono', monospace" }}>
                        Sauvegarde manuelle
                      </p>
                      <p className="text-xs" style={{ color: "#9CAA9E" }}>
                        Génère un texte contenant tout ton plan. Garde-le (note, mail, message) : si tu perds tes données, recolle-le ici et clique Restaurer.
                      </p>
                      <div className="flex gap-2">
                        <button onClick={exportBackup} className="flex-1 rounded-lg py-2 text-sm cursor-pointer hover:opacity-90 transition-opacity" style={{ background: "#2C3A32", color: "#EDE7D9" }}>
                          Générer
                        </button>
                        <button onClick={restoreBackup} className="flex-1 rounded-lg py-2 text-sm cursor-pointer hover:opacity-90 transition-opacity" style={{ background: "#5C7A99", color: "#14201C" }}>
                          Restaurer
                        </button>
                      </div>
                      <textarea value={backupText} onChange={e => setBackupText(e.target.value)} rows={4}
                        className="w-full rounded-lg px-3 py-2 text-xs outline-none"
                        style={{ background: "#1C2B24", color: "#EDE7D9", border: "1px solid #2C3A32", fontFamily: "'JetBrains Mono', monospace" }}
                        placeholder="Le texte de sauvegarde apparaîtra ici" />
                      {backupStatus && <p className="text-xs text-center" style={{ color: "#7A8B5E" }}>{backupStatus}</p>}
                    </div>
                  </div>
                )}
                {tab === "ajouter" && <SessionForm onAdd={addSession} />}
                {tab === "stats" && <Stats sessions={sessions} />}
                {tab === "historique" && (
                  <div className="space-y-3">
                    {past.length === 0 && <p className="text-sm text-center py-6" style={{ color: "#5A6259" }}>Pas encore de séance réalisée.</p>}
                    {past.map(s => <SessionRow key={s.id} s={s} onToggle={toggleSession} onDelete={deleteSession} onSaveNotes={saveNotes} vma={goal?.vma} />)}
                  </div>
                )}
              </>
            )}
          </div>

        </div>
      </div>
    </div>
  );
}


try {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
} catch (err) {
  showFatal(err && err.message ? err.message : err);
}
</script>
</body>
</html>
