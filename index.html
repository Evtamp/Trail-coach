<script>
// Affiche les erreurs à l'écran : sans ça, un plantage laisse "Chargement…" indéfiniment
function showFatal(msg) {
  var el = document.getElementById("root");
  if (el) el.innerHTML =
    '<div style="color:#D9793C;font-family:monospace;padding:1.5rem;font-size:13px;line-height:1.6">'
    + '<b>Erreur au démarrage</b><br><br>' + String(msg).replace(/</g, "&lt;") + '</div>';
}
window.addEventListener("error", function (e) { showFatal(e.message + (e.filename ? "\n" + e.filename + ":" + e.lineno : "")); });
window.addEventListener("unhandledrejection", function (e) { showFatal("Promesse rejetee : " + (e.reason && e.reason.message || e.reason)); });

/* ================================================================
   CONFIGURATION FIREBASE — a remplir (voir README, etape 2)
   Laisse vide pour utiliser le stockage local du navigateur.
   ================================================================ */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  databaseURL: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

let _fbRef = null;
let STORAGE_MODE = "local";

async function initStorage() {
  if (!FIREBASE_CONFIG.databaseURL) return;
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    const cred = await firebase.auth().signInAnonymously();
    _fbRef = firebase.database().ref("trailcoach/" + cred.user.uid);
    STORAGE_MODE = "firebase";
  } catch (e) {
    console.error("Firebase indisponible, bascule en local :", e);
    _fbRef = null;
  }
}

window.storage = {
  async get(key) {
    if (_fbRef) {
      const snap = await _fbRef.child(key).get();
      return snap.exists() ? { key, value: snap.val() } : null;
    }
    const v = localStorage.getItem("trailcoach:" + key);
    return v ? { key, value: v } : null;
  },
  async set(key, value) {
    if (_fbRef) {
      await _fbRef.child(key).set(value);
      return { key, value };
    }
    localStorage.setItem("trailcoach:" + key, value);
    return { key, value };
  },
};
window.STORAGE_MODE = () => STORAGE_MODE;
window.__storageReady = initStorage();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>

<script type="text/babel" data-presets="react">

const SESSION_ADVICE = {

const SPORT_IMPACT = {

function uid() { return Math.random().toString(36).slice(2, 10); }

function isoWeekStart(d) {
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7;
  date.setDate(date.getDate() - day);
  date.setHours(0, 0, 0, 0);
  return date;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtDate(d) { return new Date(d).toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }); }
// Attention : ne PAS utiliser toISOString() ici — il convertit en UTC, et
// minuit lundi en heure locale (UTC+2) devient dimanche 22h UTC, ce qui
// décalait toutes les étiquettes de semaine d'un jour en arrière.
function toISO(d) {
  if (typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
}

// Semaine d'appartenance d'une séance : soit sa semaine de plan (séance
// non encore placée), soit la semaine de la date à laquelle elle a été faite.
function sessionWeek(s) {
  if (s.date) return toISO(isoWeekStart(s.date));
  return s.weekStart;
}

// ======================================================================
// Allures et séances structurées basées sur la VMA
// ======================================================================

// Allure (min/km) correspondant à un pourcentage de VMA
function paceAtPct(vma, pct) {
  const speed = vma * pct / 100;
  const minPerKm = 60 / speed;
  const m = Math.floor(minPerKm);
  const s = Math.round((minPerKm - m) * 60);
  return s === 60 ? `${m + 1}:00` : `${m}:${String(s).padStart(2, "0")}`;
}

// Distance parcourue en X secondes à Y% de VMA
function metersIn(vma, pct, seconds) {
  return Math.round(vma * pct / 100 * 1000 / 3600 * seconds / 5) * 5;
}

const ZONES = [
  { key: "ef",     label: "Endurance fondamentale", pct: [65, 70] },
  { key: "ea",     label: "Endurance active",       pct: [75, 80] },
  { key: "seuil",  label: "Seuil",                  pct: [85, 90] },
  { key: "vo2",    label: "VO2max / VMA",           pct: [95, 105] },
];

/**
 * Choisit une variante de séance dans une liste, de façon déterministe et
 * stable — basée sur la semaine de la séance (weekStart, ou date pour les
 * séances ajoutées à la main), pas sur un tirage aléatoire. Comme les
 * weekStart générés sont toujours espacés de 7 jours, ce choix tourne
 * naturellement d'une semaine à l'autre (7 et le nombre de variantes étant
 * premiers entre eux dans tous les cas utilisés ici), sans jamais changer
 * pour une séance déjà créée — important car les totaux (distance/durée)
 * sont calculés une fois à la génération du plan et ne doivent pas se
 * décorréler de la séance affichée ensuite.
 */
function pickVariant(list, session) {
  if (!list || !list.length) return null;
  if (list.length === 1) return list[0];
  const key = (session && (session.weekStart || session.date)) || "";
  const days = Math.floor(new Date(key).getTime() / 86400000);
  const idx = Number.isFinite(days) ? ((days % list.length) + list.length) % list.length : 0;
  return list[idx];
}

/**
 * Construit une séance structurée (échauffement / blocs / retour au calme)
 * pour les séances de qualité, selon le type et la phase du plan. Plusieurs
 * variantes existent par phase — un vrai plan d'entraînement ne répète pas
 * indéfiniment le même format de fractionné ou de côtes ; pickVariant fait
 * tourner ces variantes semaine après semaine.
 * Renvoie null pour les séances continues (longue, fonda, récup).
 */
function buildStructuredWorkout(session, vma) {
  if (!vma) return null;
  const { type, phase } = session;
  const ph = phase || "build";

  if (type === "fractionne") {
    const plans = {
      base: [
        { name: "30/30", sets: 2, reps: 8, workSec: 30, restSec: 30, pct: 100, restPct: 50 },
        { name: "45/45", sets: 2, reps: 6, workSec: 45, restSec: 45, pct: 97,  restPct: 52 },
        { name: "1'/1'", sets: 2, reps: 5, workSec: 60, restSec: 60, pct: 95,  restPct: 55 },
      ],
      build: [
        { name: "30/30", sets: 2, reps: 10, workSec: 30, restSec: 30, pct: 102, restPct: 50 },
        { name: "200 m", sets: 3, reps: 6,  workSec: 40, restSec: 40, pct: 105, restPct: 50 },
        { name: "1'/1'", sets: 2, reps: 8,  workSec: 60, restSec: 60, pct: 100, restPct: 52 },
      ],
      peak: [
        { name: "400 m",  sets: 3, reps: 5, workSec: 90,  restSec: 75,  pct: 100, restPct: 50 },
        { name: "300 m",  sets: 3, reps: 6, workSec: 65,  restSec: 60,  pct: 103, restPct: 50 },
        { name: "1000 m", sets: 2, reps: 4, workSec: 180, restSec: 120, pct: 95,  restPct: 50 },
      ],
      taper: [
        { name: "30/30", sets: 1, reps: 8, workSec: 30, restSec: 30, pct: 100, restPct: 50 },
        { name: "200 m", sets: 1, reps: 6, workSec: 40, restSec: 50, pct: 102, restPct: 55 },
      ],
    };
    const p = pickVariant(plans[ph], session);
    return {
      title: `${p.sets} × ${p.reps} × ${p.name}`,
      warmup: { text: "20 min en endurance fondamentale + 3-4 lignes droites progressives", pace: paceAtPct(vma, 68) },
      blocks: [{
        repeats: `${p.sets} série(s) de ${p.reps} répétitions`,
        work: `${p.workSec}s à ${p.pct}% VMA (~${metersIn(vma, p.pct, p.workSec)} m)`,
        workPace: paceAtPct(vma, p.pct),
        rest: `${p.restSec}s en trot très lent`,
        restPace: paceAtPct(vma, p.restPct),
        between: p.sets > 1 ? "5 min de récupération entre les séries" : null,
      }],
      cooldown: { text: "10-15 min en endurance fondamentale", pace: paceAtPct(vma, 65) },
    };
  }

  if (type === "seuil") {
    const plans = {
      base: [
        { sets: 2, minutes: 8,  pct: 85, rest: 3 },
        { sets: 1, minutes: 15, pct: 84, rest: 3 },
        { sets: 3, minutes: 6,  pct: 86, rest: 3 },
      ],
      build: [
        { sets: 3, minutes: 8,  pct: 87, rest: 3 },
        { sets: 2, minutes: 12, pct: 86, rest: 4 },
        { sets: 4, minutes: 6,  pct: 88, rest: 3 },
      ],
      peak: [
        { sets: 2, minutes: 15, pct: 88, rest: 4 },
        { sets: 3, minutes: 10, pct: 88, rest: 3 },
      ],
      taper: [
        { sets: 2, minutes: 6,  pct: 87, rest: 3 },
        { sets: 1, minutes: 10, pct: 86, rest: 3 },
      ],
    };
    const p = pickVariant(plans[ph], session);
    return {
      title: `${p.sets} × ${p.minutes} min au seuil`,
      warmup: { text: "20 min en endurance fondamentale", pace: paceAtPct(vma, 68) },
      blocks: [{
        repeats: `${p.sets} blocs`,
        work: `${p.minutes} min à ${p.pct}% VMA (~${(vma * p.pct / 100 * p.minutes / 60).toFixed(1)} km)`,
        workPace: paceAtPct(vma, p.pct),
        rest: `${p.rest} min en trot`,
        restPace: paceAtPct(vma, 60),
        between: null,
      }],
      cooldown: { text: "10 min en endurance fondamentale", pace: paceAtPct(vma, 65) },
    };
  }

  if (type === "cotes") {
    const plans = {
      base: [
        { sets: 2, reps: 6, workSec: 45, effort: "95-100% VMA" },
        { sets: 2, reps: 8, workSec: 30, effort: "95-100% VMA" },
      ],
      build: [
        { sets: 3, reps: 6, workSec: 60, effort: "95-100% VMA" },
        { sets: 3, reps: 8, workSec: 40, effort: "98-102% VMA" },
        { sets: 2, reps: 5, workSec: 90, effort: "90-95% VMA" },
      ],
      peak: [
        { sets: 3, reps: 5, workSec: 120, effort: "90-95% VMA" },
        { sets: 4, reps: 5, workSec: 60,  effort: "95-100% VMA" },
      ],
      taper: [
        { sets: 1, reps: 6, workSec: 45, effort: "95% VMA" },
        { sets: 1, reps: 8, workSec: 30, effort: "95-100% VMA" },
      ],
    };
    const p = pickVariant(plans[ph], session);
    return {
      title: `${p.sets} × ${p.reps} × ${p.workSec}s en côte`,
      warmup: { text: "20 min en endurance fondamentale jusqu'au pied de la côte", pace: paceAtPct(vma, 68) },
      blocks: [{
        repeats: `${p.sets} série(s) de ${p.reps} montées`,
        work: `${p.workSec}s en montée à ${p.effort} — pente 6-10%`,
        workPace: "à l'effort, pas au chrono",
        rest: "descente en trot souple (récupération complète)",
        restPace: paceAtPct(vma, 55),
        between: p.sets > 1 ? "4-5 min de récupération entre les séries" : null,
      }],
      cooldown: { text: "10-15 min en endurance fondamentale", pace: paceAtPct(vma, 65) },
    };
  }

  return null;
}

// ======================================================================
// Export FIT (fichier d'entraînement structuré pour montre Garmin)
// ======================================================================

const CRC_TABLE = [0x0000, 0xCC01, 0xD801, 0x1400, 0xF001, 0x3C00, 0x2800, 0xE401,
                   0xA001, 0x6C00, 0x7800, 0xB401, 0x5000, 0x9C01, 0x8801, 0x4400];

function fitCrc(bytes) {
  let crc = 0;
  for (const b of bytes) {
    let tmp = CRC_TABLE[crc & 0xF];
    crc = (crc >> 4) & 0x0FFF;
    crc = crc ^ tmp ^ CRC_TABLE[b & 0xF];
    tmp = CRC_TABLE[crc & 0xF];
    crc = (crc >> 4) & 0x0FFF;
    crc = crc ^ tmp ^ CRC_TABLE[(b >> 4) & 0xF];
  }
  return crc & 0xFFFF;
}

// Petit writer binaire little-endian
function makeWriter() {
  const bytes = [];
  return {
    bytes,
    u8: v => bytes.push(v & 0xFF),
    u16: v => { bytes.push(v & 0xFF, (v >> 8) & 0xFF); },
    u32: v => { bytes.push(v & 0xFF, (v >> 8) & 0xFF, (v >> 16) & 0xFF, (v >>> 24) & 0xFF); },
    str: (v, len) => {
      const enc = new TextEncoder().encode(v).slice(0, len - 1);
      for (let i = 0; i < len; i++) bytes.push(i < enc.length ? enc[i] : 0);
    },
  };
}

const NAME_LEN = 16;
const FIT_EPOCH = Date.UTC(1989, 11, 31) / 1000;

// Constantes FIT
const DUR_TIME = 0, DUR_DISTANCE = 1, DUR_OPEN = 5, DUR_REPEAT = 6;
const TGT_SPEED = 0, TGT_OPEN = 2;
const INT_ACTIVE = 0, INT_REST = 1, INT_WARMUP = 2, INT_COOLDOWN = 3;

function speedMs(vma, pct) { return vma * pct / 100 / 3.6; }

/**
 * Traduit une séance structurée en liste d'étapes FIT.
 * Les séries sont dépliées (une boucle "repeat" par série) : les répétitions
 * imbriquées ne sont pas supportées par toutes les montres.
 */
function workoutToFitSteps(session, vma) {
  const w = buildStructuredWorkout(session, vma);
  const steps = [];

  if (!w) {
    // Séance continue (longue, EF, récup) : une seule étape sur la distance
    const pct = { longue: 70, fonda: 68, recup: 62 }[session.type] || 68;
    steps.push({
      name: TYPES[session.type].label.slice(0, NAME_LEN - 1),
      durType: DUR_DISTANCE, durValue: Math.round((session.distance || 10) * 100000), // cm
      tgtType: TGT_SPEED, lo: speedMs(vma, pct - 4), hi: speedMs(vma, pct + 4),
      intensity: INT_ACTIVE,
    });
    return steps;
  }

  // Échauffement (20 min par défaut)
  steps.push({
    name: "Echauffement", durType: DUR_TIME, durValue: 20 * 60 * 1000,
    tgtType: TGT_SPEED, lo: speedMs(vma, 63), hi: speedMs(vma, 72), intensity: INT_WARMUP,
  });

  const b = w.blocks[0];
  const setsMatch = /^(\d+)/.exec(b.repeats);
  const sets = setsMatch ? Number(setsMatch[1]) : 1;
  const repsMatch = /de (\d+)/.exec(b.repeats);
  const reps = repsMatch ? Number(repsMatch[1]) : 1;

  // Durée et intensité du travail, extraites de la séance structurée
  const secMatch = /(\d+)s/.exec(b.work);
  const minMatch = /(\d+) min/.exec(b.work);
  const workMs = secMatch ? Number(secMatch[1]) * 1000 : (minMatch ? Number(minMatch[1]) * 60000 : 60000);
  const pctMatch = /(\d+)(?:-\d+)?% VMA/.exec(b.work);
  const workPct = pctMatch ? Number(pctMatch[1]) : 100;

  const restSecMatch = /(\d+)s/.exec(b.rest);
  const restMinMatch = /(\d+) min/.exec(b.rest);
  const restMs = restSecMatch ? Number(restSecMatch[1]) * 1000
               : (restMinMatch ? Number(restMinMatch[1]) * 60000 : 60000);
  const isHill = session.type === "cotes";

  for (let set = 0; set < sets; set++) {
    const loopStart = steps.length;
    steps.push({
      name: isHill ? "Montee" : "Effort", durType: DUR_TIME, durValue: workMs,
      tgtType: isHill ? TGT_OPEN : TGT_SPEED,
      lo: speedMs(vma, workPct - 3), hi: speedMs(vma, workPct + 3), intensity: INT_ACTIVE,
    });
    steps.push({
      name: isHill ? "Descente" : "Recup", durType: DUR_TIME, durValue: restMs,
      tgtType: TGT_OPEN, lo: 0, hi: 0, intensity: INT_REST,
    });
    if (reps > 1) {
      steps.push({ name: "", durType: DUR_REPEAT, durValue: loopStart, tgtType: null, repeatCount: reps });
    }
    if (b.between && set < sets - 1) {
      steps.push({
        name: "Recup serie", durType: DUR_TIME, durValue: 5 * 60 * 1000,
        tgtType: TGT_OPEN, lo: 0, hi: 0, intensity: INT_REST,
      });
    }
  }

  steps.push({
    name: "Retour au calme", durType: DUR_TIME, durValue: 12 * 60 * 1000,
    tgtType: TGT_SPEED, lo: speedMs(vma, 60), hi: speedMs(vma, 70), intensity: INT_COOLDOWN,
  });

  return steps;
}

function buildFitFile(session, vma) {
  const steps = workoutToFitSteps(session, vma);
  const wktName = `${TYPES[session.type].label} ${session.weekStart || ""}`.slice(0, NAME_LEN - 1);
  const w = makeWriter();

  // --- file_id (global 0), local type 0
  w.u8(0x40); w.u8(0); w.u8(0); w.u16(0); w.u8(4);
  w.u8(0); w.u8(1); w.u8(0x00);           // type: enum
  w.u8(1); w.u8(2); w.u8(0x84);           // manufacturer: uint16
  w.u8(2); w.u8(2); w.u8(0x84);           // product: uint16
  w.u8(4); w.u8(4); w.u8(0x86);           // time_created: uint32
  w.u8(0x00);                              // data record
  w.u8(5);                                 // type = workout
  w.u16(255);                              // manufacturer = development
  w.u16(0);
  w.u32(Math.floor(Date.now() / 1000) - FIT_EPOCH);

  // --- workout (global 26), local type 1
  w.u8(0x41); w.u8(0); w.u8(0); w.u16(26); w.u8(4);
  w.u8(4); w.u8(1); w.u8(0x00);           // sport: enum
  w.u8(5); w.u8(4); w.u8(0x8C);           // capabilities: uint32z
  w.u8(6); w.u8(2); w.u8(0x84);           // num_valid_steps: uint16
  w.u8(8); w.u8(NAME_LEN); w.u8(0x07);    // wkt_name: string
  w.u8(0x01);
  w.u8(1);                                 // sport = running
  w.u32(32);                               // capabilities
  w.u16(steps.length);
  w.str(wktName, NAME_LEN);

  // --- workout_step (global 27), local type 2
  w.u8(0x42); w.u8(0); w.u8(0); w.u16(27); w.u8(8);
  w.u8(254); w.u8(2); w.u8(0x84);         // message_index: uint16
  w.u8(0);   w.u8(NAME_LEN); w.u8(0x07);  // wkt_step_name: string
  w.u8(1);   w.u8(1); w.u8(0x00);         // duration_type: enum
  w.u8(2);   w.u8(4); w.u8(0x86);         // duration_value: uint32
  w.u8(3);   w.u8(1); w.u8(0x00);         // target_type: enum
  w.u8(4);   w.u8(4); w.u8(0x86);         // target_value: uint32
  w.u8(5);   w.u8(4); w.u8(0x86);         // custom_target_value_low: uint32
  w.u8(6);   w.u8(4); w.u8(0x86);         // custom_target_value_high: uint32

  steps.forEach((st, i) => {
    w.u8(0x02);
    w.u16(i);
    w.str(st.name || "", NAME_LEN);
    w.u8(st.durType);
    w.u32(st.durValue);
    if (st.durType === DUR_REPEAT) {
      w.u8(0xFF);                          // target_type invalide
      w.u32(st.repeatCount);               // target_value = nb de répétitions
      w.u32(0xFFFFFFFF); w.u32(0xFFFFFFFF);
    } else if (st.tgtType === TGT_SPEED) {
      w.u8(TGT_SPEED);
      w.u32(0);                            // 0 => on utilise la plage custom
      w.u32(Math.round(st.lo * 1000));
      w.u32(Math.round(st.hi * 1000));
    } else {
      w.u8(TGT_OPEN);
      w.u32(0); w.u32(0xFFFFFFFF); w.u32(0xFFFFFFFF);
    }
  });

  const data = Uint8Array.from(w.bytes);

  // --- en-tête 14 octets + CRC
  const h = makeWriter();
  h.u8(14); h.u8(0x20); h.u16(2140); h.u32(data.length);
  h.bytes.push(0x2E, 0x46, 0x49, 0x54);   // ".FIT"
  const header = Uint8Array.from(h.bytes);
  const headerCrc = fitCrc(header);

  const out = new Uint8Array(14 + data.length + 2);
  out.set(header, 0);
  out[12] = headerCrc & 0xFF; out[13] = (headerCrc >> 8) & 0xFF;
  out.set(data, 14);
  const fileCrc = fitCrc(out.slice(0, 14 + data.length));
  out[14 + data.length] = fileCrc & 0xFF;
  out[15 + data.length] = (fileCrc >> 8) & 0xFF;
  return out;
}

function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Version texte, pour recréer la séance à la main dans Garmin Connect
function workoutToText(session, vma) {
  const w = buildStructuredWorkout(session, vma);
  const L = [`${TYPES[session.type].label}${session.weekStart ? ` — semaine du ${session.weekStart}` : ""}`];
  if (session.distance) L.push(`Cible : ${session.distance} km${session.dplus ? ` / ${session.dplus} m D+` : ""}`);
  if (!w) {
    L.push("", SESSION_ADVICE[session.type]);
    return L.join("\n");
  }
  L.push("", w.title, "");
  L.push(`1. Échauffement — ${w.warmup.text} (~${w.warmup.pace}/km)`);
  w.blocks.forEach(b => {
    L.push(`2. ${b.repeats}`);
    L.push(`   • ${b.work}${b.workPace.includes(":") ? ` (~${b.workPace}/km)` : ""}`);
    L.push(`   • récup : ${b.rest} (~${b.restPace}/km)`);
    if (b.between) L.push(`   • ${b.between}`);
  });
  L.push(`3. Retour au calme — ${w.cooldown.text} (~${w.cooldown.pace}/km)`);
  return L.join("\n");
}

/**
 * Déplie une séance structurée en segments élémentaires (échauffement,
 * chaque effort, chaque récup, retour au calme). Sert à la fois au calcul
 * des totaux prévus et à l'analyse chronologique.
 */
function expandWorkout(session, vma) {
  const w = buildStructuredWorkout(session, vma);
  if (!w) return null;
  const t = sessionTargets(session);
  const b = w.blocks[0];

  const sets = Number((/^(\d+)/.exec(b.repeats) || [])[1]) || 1;
  const reps = Number((/de (\d+)/.exec(b.repeats) || [])[1]) || 1;

  const wSec = /(\d+)s/.exec(b.work);
  const wMin = /(\d+) min/.exec(b.work);
  const workSec = wSec ? Number(wSec[1]) : (wMin ? Number(wMin[1]) * 60 : 60);
  const pctM = /(\d+)(?:-\d+)?% VMA/.exec(b.work);
  const workPct = pctM ? Number(pctM[1]) : t.work;

  const rSec = /(\d+)s/.exec(b.rest);
  const rMin = /(\d+) min/.exec(b.rest);
  const restSec = rSec ? Number(rSec[1]) : (rMin ? Number(rMin[1]) * 60 : 60);

  const isHill = session.type === "cotes";
  const segs = [{ kind: "echauffement", sec: 20 * 60, pct: t.warmup }];
  for (let set = 0; set < sets; set++) {
    for (let r = 0; r < reps; r++) {
      segs.push({ kind: "effort", sec: workSec, pct: workPct, hill: isHill });
      segs.push({ kind: "recup", sec: restSec, pct: t.rest });
    }
    if (b.between && set < sets - 1) segs.push({ kind: "recup", sec: 5 * 60, pct: t.rest, serie: true });
  }
  segs.push({ kind: "calme", sec: 12 * 60, pct: t.cooldown });
  return segs;
}

// Distance et durée réellement impliquées par une séance structurée
function structuredTotals(session, vma) {
  const segs = expandWorkout(session, vma);
  if (!segs) return null;
  const sec = segs.reduce((a, s) => a + s.sec, 0);
  const km = segs.reduce((a, s) => a + (vma * s.pct / 100) * (s.sec / 3600), 0);

  // Dénivelé réellement produit par les montées : en côte, ce qui compte est
  // la vitesse ascensionnelle (~900 m/h sur des montées courtes à haute
  // intensité, ~800 m/h au-delà de 90s), pas la distance parcourue.
  const dplus = segs
    .filter(s => s.hill)
    .reduce((a, s) => a + (s.sec <= 90 ? 900 : 800) * (s.sec / 3600), 0);

  return {
    distance: Math.round(km * 10) / 10,
    duree: Math.round(sec / 60),
    dplus: dplus > 0 ? Math.round(dplus) : null,
  };
}

// ======================================================================
// Plan generator
// ======================================================================

/**
 * goal = {
 *   type: 'trail' | 'route', raceDate: 'YYYY-MM-DD', distanceKm, dPlus,
 *   daysPerWeek, vma, startVolumeKm, otherSports: [{name, freq}]
 * }
 */
function buildPhases(totalWeeks) {
  if (totalWeeks <= 3) return Array(totalWeeks).fill("taper");
  const taperWeeks = totalWeeks >= 10 ? 3 : 2;
  const baseWeeks = Math.max(1, Math.round((totalWeeks - taperWeeks) * 0.45));
  const buildWeeks = Math.max(1, Math.round((totalWeeks - taperWeeks) * 0.4));
  const peakWeeks = Math.max(0, totalWeeks - taperWeeks - baseWeeks - buildWeeks);
  const phases = [
    ...Array(baseWeeks).fill("base"),
    ...Array(buildWeeks).fill("build"),
    ...Array(peakWeeks).fill("peak"),
    ...Array(taperWeeks).fill("taper"),
  ];
  return phases.slice(0, totalWeeks);
}

function crossTrainingPenaltyKm(otherSports) {
  return (otherSports || []).reduce((sum, s) => {
    const impact = SPORT_IMPACT[s.name] ?? SPORT_IMPACT.Autre;
    return sum + s.freq * impact * 2.5;
  }, 0);
}

function weekVolumeTarget(weekIdx, phase, startVolumeKm, phaseWeekIdx) {
  const isCutback = phase !== "taper" && (phaseWeekIdx + 1) % 4 === 0;
  let growthRate = phase === "base" ? 0.045 : phase === "build" ? 0.06 : phase === "peak" ? 0.02 : -0.25;
  if (phase === "taper") {
    // décroissance forte les 2-3 dernières semaines
    return startVolumeKm; // handled by caller via explicit taper curve
  }
  let vol = startVolumeKm * Math.pow(1 + growthRate, weekIdx);
  if (isCutback) vol *= 0.75;
  return vol;
}

function sessionTemplateForDays(daysPerWeek, raceType) {
  const quality = raceType === "trail" ? "cotes" : "seuil";
  const templates = {
    2: ["fractionne", "longue"],
    3: [quality, "fonda", "longue"],
    4: ["fractionne", quality, "fonda", "longue"],
    5: ["fractionne", quality, "fonda", "recup", "longue"],
    6: ["fractionne", quality, "fonda", "fonda", "recup", "longue"],
  };
  return templates[Math.min(6, Math.max(2, daysPerWeek))];
}

function generatePlan(goal) {
  const today = new Date();
  const race = new Date(goal.raceDate);
  const totalWeeks = Math.max(1, Math.ceil((race - isoWeekStart(today)) / (7 * 24 * 60 * 60 * 1000)));
  const phases = buildPhases(totalWeeks);
  const penalty = crossTrainingPenaltyKm(goal.otherSports);
  const minVolume = goal.daysPerWeek * 5;

  const peakVolume = goal.startVolumeKm * Math.pow(1.045, phases.filter(p => p === "base").length)
    * Math.pow(1.06, phases.filter(p => p === "build").length);

  const sessions = [];
  let phaseWeekIdx = 0, prevPhase = null;

  phases.forEach((phase, weekIdx) => {
    phaseWeekIdx = phase === prevPhase ? phaseWeekIdx + 1 : 0;
    prevPhase = phase;

    const weekStart = addDays(isoWeekStart(today), weekIdx * 7);
    let targetVolume;
    if (phase === "taper") {
      const weeksToRace = phases.length - weekIdx;
      const frac = weeksToRace <= 1 ? 0.35 : weeksToRace === 2 ? 0.6 : 0.75;
      targetVolume = peakVolume * frac;
    } else {
      targetVolume = weekVolumeTarget(weekIdx, phase, goal.startVolumeKm, phaseWeekIdx);
    }
    targetVolume = Math.max(minVolume, targetVolume - penalty);

    // Gradient de la course (m de D+ par km) — sert de référence pour calibrer
    // le dénivelé de chaque séance, chacune avec sa propre "densité" de D+ :
    // les côtes concentrent bien plus de D+/km que la course elle-même
    // (répétitions denses), la longue s'en rapproche, les séances rapides
    // (fractionné/seuil) restent quasi plates.
    const raceGradient = goal.type === "trail" ? goal.dPlus / goal.distanceKm : 0;
    const climbDensity = { longue: 0.8, fractionne: 0.1, seuil: 0.1, cotes: 3.5, fonda: 0.5, recup: 0.2 };
    const phaseDPlusFactor = { base: 0.7, build: 1.0, peak: 1.3, taper: 0.5 }[phase];

    const template = sessionTemplateForDays(goal.daysPerWeek, goal.type);
    const shareByType = { longue: 0.38, fractionne: 0.16, seuil: 0.18, cotes: 0.2, fonda: 0.16, recup: 0.12 };

    // Les séances de qualité ont une distance et une durée dictées par leur
    // structure (échauffement + séries + récup + retour au calme) : on les
    // calcule d'abord, puis on répartit le volume restant sur les séances
    // continues. Sans ça, la durée prévue supposait toute la séance courue
    // à l'allure des fractions — cible impossible et comparaison faussée.
    const QUALITY = ["fractionne", "seuil", "cotes"];
    const totalsByType = {};
    let qualityKm = 0;
    template.forEach(type => {
      if (QUALITY.includes(type) && !totalsByType[type]) {
        // weekStart identique à celui stocké sur la séance plus bas : la
        // variante choisie ici (pour calculer distance/durée) doit rester
        // celle affichée ensuite, sinon les totaux ne correspondent plus
        // à la séance structurée montrée à l'utilisateur.
        const tot = structuredTotals({ type, phase, weekStart: toISO(weekStart) }, goal.vma);
        if (tot) { totalsByType[type] = tot; qualityKm += tot.distance; }
      }
    });

    const contTypes = template.filter(t => !totalsByType[t]);
    const contShare = contTypes.reduce((a, t) => a + shareByType[t], 0) || 1;
    const remaining = Math.max(targetVolume * 0.35, targetVolume - qualityKm);

    // --- Répartition du dénivelé de la semaine ---------------------------
    // Les séances de côtes produisent le D+ dicté par leurs montées (calculé
    // ci-dessus), et le fractionné/seuil se court quasiment à plat. Le reste
    // du D+ hebdomadaire doit donc être porté par les sorties sur le terrain,
    // sortie longue en tête — c'est là qu'on accumule vraiment du dénivelé.
    const weeklyDPlus = goal.type === "trail"
      ? Math.round(targetVolume * raceGradient * phaseDPlusFactor) : 0;

    const distanceFor = type => {
      const t = totalsByType[type];
      return t ? t.distance : Math.round(remaining * (shareByType[type] / contShare) * 10) / 10;
    };

    let structuralDPlus = 0;
    template.forEach(type => {
      const t = totalsByType[type];
      if (!t) return;
      structuralDPlus += t.dplus != null ? t.dplus : Math.round(distanceFor(type) * raceGradient * 0.15);
    });

    // ce qu'il reste à répartir sur les séances continues, plafonné à une
    // densité crédible (2× le gradient de la course) pour ne pas prescrire
    // des sorties impossibles à trouver sur le terrain
    const contDistance = contTypes.reduce((a, t) => a + distanceFor(t), 0) || 1;
    const restDPlus = Math.max(0, weeklyDPlus - structuralDPlus);
    const contWeights = { longue: 1.5, fonda: 0.8, recup: 0.3 };
    const weightSum = contTypes.reduce((a, t) => a + distanceFor(t) * (contWeights[t] ?? 0.8), 0) || 1;

    template.forEach((type, i) => {
      const tot = totalsByType[type];
      const distance = distanceFor(type);

      let dplus = null;
      if (goal.type === "trail") {
        if (tot) {
          dplus = tot.dplus != null ? tot.dplus : Math.round(distance * raceGradient * 0.15);
        } else {
          const share = (distance * (contWeights[type] ?? 0.8)) / weightSum;
          dplus = Math.round(Math.min(restDPlus * share, distance * raceGradient * 2));
        }
      }

      let duree;
      if (tot) {
        duree = tot.duree;
      } else {
        const paceFactor = { longue: goal.type === "trail" ? 0.6 : 0.75, fonda: 0.7, recup: 0.65 }[type] || 0.7;
        duree = Math.round((distance / (goal.vma * paceFactor)) * 60);
      }

      sessions.push({
        id: uid(),
        type,
        date: null,          // libre : tu places la séance le jour qui t'arrange
        order: i,            // ordre conseillé dans la semaine (longue en dernier)
        distance,
        dplus: goal.type === "trail" ? dplus : null,
        duree,
        notes: "",
        done: false,
        actual: null,
        generated: true,
        phase,
        weekStart: toISO(weekStart),
      });
    });
  });

  return sessions;
}

// ======================================================================
// Adaptive adjustment engine
// ======================================================================

function evaluateAndAdjust(sessions, evaluations) {
  const today = new Date();
  const generated = sessions.filter(s => s.generated);
  const weeks = [...new Set(generated.map(s => s.weekStart))].sort();

  let newSessions = [...sessions];
  let newEvaluations = { ...evaluations };

  for (const weekStart of weeks) {
    const weekEnd = addDays(weekStart, 6);
    if (weekEnd >= today) continue; // semaine pas encore terminée
    if (newEvaluations[weekStart]) continue; // déjà évaluée

    const weekSessions = generated.filter(s => s.weekStart === weekStart);
    const plannedKm = weekSessions.reduce((a, s) => a + (s.distance || 0), 0);

    // Le volume réalisé compte TOUTE la course à pied de la semaine, y compris
    // les séances ajoutées hors plan (footing improvisé, sortie spontanée).
    // Les activités complémentaires (vélo, renfo, natation) en sont exclues.
    const realizedKm = sessions
      .filter(s => s.done && !isCross(s.type) && sessionWeek(s) === weekStart)
      .reduce((a, s) => a + (s.actual?.distance ?? s.distance ?? 0), 0);
    const complianceRatio = plannedKm > 0 ? realizedKm / plannedKm : 1;
    const missedKey = weekSessions.filter(s => ["longue", "fractionne", "seuil", "cotes"].includes(s.type) && !s.done).length;
    const feelings = sessions
      .filter(s => s.done && !isCross(s.type) && sessionWeek(s) === weekStart && s.actual?.feeling)
      .map(s => s.actual.feeling);
    const avgFeeling = feelings.length ? feelings.reduce((a, b) => a + b, 0) / feelings.length : null;

    let multiplier = 1, reason = "Progression normale.";
    if (complianceRatio < 0.6 || missedKey >= 2) {
      multiplier = 0.75;
      reason = "Charge réduite : plusieurs séances manquées cette semaine.";
    } else if (complianceRatio < 0.85) {
      multiplier = 0.9;
      reason = "Charge maintenue : quelques séances manquées.";
    } else if (avgFeeling !== null && avgFeeling >= 4.3) {
      multiplier = 0.9;
      reason = "Charge légèrement réduite : ressenti élevé la semaine passée.";
    }

    newEvaluations[weekStart] = { complianceRatio, missedKey, avgFeeling, multiplier, reason };

    if (multiplier !== 1) {
      const nextWeekStart = toISO(addDays(weekStart, 7));
      newSessions = newSessions.map(s => {
        if (s.generated && s.weekStart === nextWeekStart && !s.done) {
          return {
            ...s,
            distance: Math.round(s.distance * multiplier * 10) / 10,
            dplus: s.dplus != null ? Math.round(s.dplus * multiplier) : null,
            duree: Math.round(s.duree * multiplier),
          };
        }
        return s;
      });
    }
  }

  return { sessions: newSessions, evaluations: newEvaluations };
}

          <div key={i} className="flex items-center justify-between text-sm py-1" style={{ color: "#9CAA9E" }}>
            <span>{s.name} · {s.freq}×/sem</span>
            <button onClick={() => removeSport(i)} style={{ color: "#5A6259" }}>✕</button>
          </div>
        ))}
      </div>

      <button
        disabled={!canSave}
        onClick={() => onSave({ type, raceDate, distanceKm: Number(distanceKm), dPlus: Number(dPlus) || 0, daysPerWeek, vma: Number(vma), startVolumeKm: Number(startVolumeKm), otherSports })}
        className="w-full rounded-lg py-2.5 text-sm font-medium disabled:opacity-40 cursor-pointer disabled:cursor-not-allowed hover:opacity-90 transition-opacity"
        style={{ background: "#C1622B", color: "#14201C" }}
      >
        Générer le plan
      </button>
    </div>
  );
}

function ElevationHero({ goal, progress, daysLeft }) {
  const pts = [[0, 92], [6, 78], [12, 82], [18, 55], [24, 62], [30, 30], [38, 40], [46, 14], [54, 24], [62, 8], [70, 20], [78, 38], [86, 30], [94, 55], [100, 70]];
  const path = "M " + pts.map(([x, y]) => `${x},${y}`).join(" L ");
  const areaPath = path + ` L 100,100 L 0,100 Z`;
  const markerX = Math.min(100, Math.max(0, progress * 100));
  let markerY = 92;
  for (let i = 0; i < pts.length - 1; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    if (markerX >= x1 && markerX <= x2) { const t = x2 === x1 ? 0 : (markerX - x1) / (x2 - x1); markerY = y1 + (y2 - y1) * t; break; }
  }
  return (
    <div className="relative w-full overflow-hidden rounded-2xl" style={{ background: "linear-gradient(180deg, #1C2B24 0%, #14201C 100%)" }}>
      <div className="px-6 pt-6 flex items-baseline justify-between">
        <div>
          <p className="uppercase tracking-[0.2em] text-xs" style={{ color: "#7A8B5E", fontFamily: "'JetBrains Mono', monospace" }}>
            {goal ? (goal.type === "trail" ? "Objectif trail" : "Objectif route") : "Aucun objectif"}
          </p>
          <h1 className="text-2xl sm:text-3xl mt-1" style={{ fontFamily: "'Space Grotesk', sans-serif", color: "#EDE7D9" }}>
            {goal ? `${goal.distanceKm} km${goal.type === "trail" ? ` · ${goal.dPlus} m D+` : ""}` : "—"}
          </h1>
        </div>
        <div className="text-right">
          <p className="uppercase tracking-[0.2em] text-xs" style={{ color: "#7A8B5E", fontFamily: "'JetBrains Mono', monospace" }}>Départ</p>
          <p className="text-lg" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#EDE7D9" }}>{goal ? `${daysLeft} j` : "—"}</p>
        </div>
      </div>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="w-full h-40 sm:h-48 mt-4">
        <defs>
          <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#7A8B5E" stopOpacity="0.35" />
            <stop offset="100%" stopColor="#7A8B5E" stopOpacity="0" />
          </linearGradient>
        </defs>
        <path d={areaPath} fill="url(#fillGrad)" />
        <path d={path} fill="none" stroke="#9CAA9E" strokeWidth="0.6" vectorEffect="non-scaling-stroke" />
        {goal && (<>
          <circle cx={markerX} cy={markerY} r="1.6" fill="#EDE7D9" stroke="#C1622B" strokeWidth="0.8" vectorEffect="non-scaling-stroke" />
          <line x1={markerX} y1={markerY} x2={markerX} y2="100" stroke="#C1622B" strokeWidth="0.3" strokeDasharray="1,1" vectorEffect="non-scaling-stroke" />
        </>)}
      </svg>
      <div className="px-6 pb-5 -mt-2 flex justify-between text-xs" style={{ fontFamily: "'JetBrains Mono', monospace", color: "#5A6259" }}>
        <span>Bloc en cours</span>
        {goal && <span style={{ color: "#C1622B" }}>vous êtes ici</span>}
        <span>{goal ? fmtDate(goal.raceDate) : ""}</span>
      </div>
    </div>
  );
}

function Ring({ value, target, unit, label, color, format }) {
  const R = 26, STROKE = 6, SIZE = 68;
  const C = 2 * Math.PI * R;
  const ratio = target > 0 ? value / target : 0;
  const filled = Math.min(1, ratio);
  const done = ratio >= 1;
  const fmt = format || (v => Math.round(v));

  return (
    <div className="flex flex-col items-center">
      <svg width={SIZE} height={SIZE} viewBox={`0 0 ${SIZE} ${SIZE}`}>
        {/* piste = objectif de la semaine */}
        <circle cx={SIZE / 2} cy={SIZE / 2} r={R} fill="none" stroke="#2C3A32" strokeWidth={STROKE} />
        {/* arc = réalisé */}
        <circle
          cx={SIZE / 2} cy={SIZE / 2} r={R} fill="none"
          stroke={color} strokeWidth={STROKE} strokeLinecap="round"
          strokeDasharray={`${C * filled} ${C}`}
          transform={`rotate(-90 ${SIZE / 2} ${SIZE / 2})`}
        />
        {/* liseré si l'objectif est dépassé */}
        {done && (
          <circle cx={SIZE / 2} cy={SIZE / 2} r={R - STROKE} fill="none" stroke={color} strokeWidth="1" opacity="0.5" />
        )}
        <text x={SIZE / 2} y={SIZE / 2 + 1} textAnchor="middle"
          fontSize="15" fill="#EDE7D9" fontFamily="'JetBrains Mono', monospace">
          {fmt(value)}
        </text>
        <text x={SIZE / 2} y={SIZE / 2 + 12} textAnchor="middle"
          fontSize="7.5" fill="#5A6259" fontFamily="'JetBrains Mono', monospace">
          / {fmt(target)}
        </text>
      </svg>
      <p className="text-xs mt-1" style={{ color: "#9CAA9E" }}>{label}</p>
      <p className="text-xs" style={{ color: done ? color : "#5A6259", fontFamily: "'JetBrains Mono', monospace" }}>
        {target > 0 ? `${Math.round(ratio * 100)}%` : "—"} {unit}
      </p>
    </div>
  );
}

function WeekRings({ sessions }) {
  const wk = toISO(isoWeekStart(new Date()));

  // Objectif = ce que le plan prévoit cette semaine
  const planned = sessions.filter(s => s.generated && s.weekStart === wk);
  // Réalisé = toute la course à pied faite cette semaine, plan ou hors plan
  const doneRun = sessions.filter(s => s.done && !isCross(s.type) && sessionWeek(s) === wk);
  const doneCross = sessions.filter(s => s.done && isCross(s.type) && sessionWeek(s) === wk);

  const sum = (arr, f) => arr.reduce((a, s) => a + (f(s) || 0), 0);
  const targetKm = sum(planned, s => s.distance);
  const targetD = sum(planned, s => s.dplus);
  const targetMin = sum(planned, s => s.duree);
  const realKm = sum(doneRun, s => s.actual?.distance ?? s.distance);
  const realD = sum(doneRun, s => s.actual?.dplus ?? s.dplus);
  const realMin = sum(doneRun, s => s.actual?.duree ?? s.duree);
  const crossMin = sum(doneCross, s => s.actual?.duree ?? s.duree);

  if (!targetKm && !realKm) return null;

  const hrs = v => (v >= 60 ? `${Math.floor(v / 60)}h${String(Math.round(v % 60)).padStart(2, "0")}` : `${Math.round(v)}′`);

  return (
    <div className="rounded-xl p-4" style={{ background: "#182420", border: "1px solid #2C3A32" }}>
      <div className="flex items-baseline justify-between mb-3">
        <p className="text-xs uppercase tracking-wider" style={{ color: "#7A8B5E", fontFamily: "'JetBrains Mono', monospace" }}>
          Semaine en cours
        </p>
        <p className="text-xs" style={{ color: "#5A6259", fontFamily: "'JetBrains Mono', monospace" }}>
          {doneRun.length}/{planned.length} séances
        </p>
      </div>

      <div className="grid grid-cols-3 gap-2">
        <Ring value={realKm} target={targetKm} label="Distance" unit="km" color="#C1622B" format={v => Math.round(v)} />
        <Ring value={realD} target={targetD} label="Dénivelé" unit="m D+" color="#B0863C" format={v => Math.round(v)} />
        <Ring value={realMin} target={targetMin} label="Temps" unit="" color="#7A8B5E" format={hrs} />
      </div>

      {crossMin > 0 && (
        <p className="text-xs mt-3 text-center" style={{ color: "#5C7A99" }}>
          + {hrs(crossMin)} d'activité complémentaire (hors objectifs course)
        </p>
      )}
    </div>
  );
}

function SessionForm({ onAdd }) {
  const [type, setType] = useState("recup");
  const [date, setDate] = useState(() => toISO(new Date()));
  const [distance, setDistance] = useState("");
  const [dplus, setDplus] = useState("");
  const [duree, setDuree] = useState("");
  const [fc, setFc] = useState("");
  const [feeling, setFeeling] = useState(3);
  const [notes, setNotes] = useState("");
  const [alreadyDone, setAlreadyDone] = useState(true);
  const [msg, setMsg] = useState("");

  const inputCls = "w-full rounded-lg px-3 py-2 text-sm outline-none";
  const inputStyle = { background: "#1C2B24", color: "#EDE7D9", border: "1px solid #2C3A32" };
  const cross = isCross(type);

  const submit = () => {
    const d = distance ? Number(distance) : null;
    const dp = dplus ? Number(dplus) : null;
    const du = duree ? Number(duree) : null;
    onAdd({
      id: uid(), type, date,
      distance: d, dplus: dp, duree: du,
      notes, generated: false,
      done: alreadyDone,
      actual: alreadyDone
        ? { distance: d, dplus: dp, duree: du, feeling, fc: fc ? Number(fc) : null, laps: [] }
        : null,
    });
    setDistance(""); setDplus(""); setDuree(""); setFc(""); setNotes("");
    setMsg(alreadyDone ? "Séance ajoutée à l'historique" : "Séance ajoutée au plan");
    setTimeout(() => setMsg(""), 3000);
  };

  return (
    <div className="rounded-xl p-4 space-y-3" style={{ background: "#182420", border: "1px solid #2C3A32" }}>
      <p className="text-sm uppercase tracking-wider" style={{ color: "#7A8B5E", fontFamily: "'JetBrains Mono', monospace" }}>
        Ajouter une séance hors plan
      </p>
      <p className="text-xs" style={{ color: "#9CAA9E" }}>
        Footing improvisé, renfo, vélo, natation… Les activités hors course sont
        suivies à part et n'entrent pas dans le volume de course à pied.
      </p>

      <div className="grid grid-cols-2 lg:grid-cols-3 gap-2">
        <select value={type} onChange={e => setType(e.target.value)} className={inputCls} style={inputStyle}>
          <optgroup label="Course à pied">
            {Object.entries(TYPES).filter(([k, v]) => !v.cross && k !== "repos")
              .map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
          </optgroup>
          <optgroup label="Complémentaire">
            {Object.entries(TYPES).filter(([, v]) => v.cross)
              .map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
          </optgroup>
        </select>
        <input type="date" value={date} onChange={e => setDate(e.target.value)} className={inputCls} style={inputStyle} />

        {type !== "renfo" && (
          <input type="number" placeholder="Distance (km)" value={distance} onChange={e => setDistance(e.target.value)} className={inputCls} style={inputStyle} />
        )}
        {!cross && (
          <input type="number" placeholder="D+ (m)" value={dplus} onChange={e => setDplus(e.target.value)} className={inputCls} style={inputStyle} />
        )}
        <input type="number" placeholder="Durée (min)" value={duree} onChange={e => setDuree(e.target.value)} className={inputCls} style={inputStyle} />
        <input type="number" placeholder="FC moy" value={fc} onChange={e => setFc(e.target.value)} className={inputCls} style={inputStyle} />
      </div>

      <input type="text" placeholder="Notes" value={notes} onChange={e => setNotes(e.target.value)} className={inputCls} style={inputStyle} />

      <label className="flex items-center gap-2 text-sm" style={{ color: "#9CAA9E" }}>
        <input type="checkbox" checked={alreadyDone} onChange={e => setAlreadyDone(e.target.checked)} />
        Séance déjà réalisée
      </label>

      {alreadyDone && (
        <div>
          <label className="text-xs" style={{ color: "#5A6259" }}>Ressenti : {feeling}/5</label>
          <input type="range" min="1" max="5" value={feeling} onChange={e => setFeeling(Number(e.target.value))} className="w-full" />
        </div>
      )}

      <button onClick={submit} className="w-full rounded-lg py-2.5 text-sm font-medium cursor-pointer hover:opacity-90 transition-opacity" style={{ background: "#C1622B", color: "#14201C" }}>
        Ajouter
      </button>
      {msg && <p className="text-xs text-center" style={{ color: "#7A8B5E" }}>{msg}</p>}
    </div>
  );
}

function ActualForm({ defaults, onSubmit, onCancel }) {
  // Si la séance a déjà été validée, on repart de ce qui a été saisi ;
  // sinon on pré-remplit avec les valeurs prévues.
  const a = defaults.actual || {};
  const [date, setDate] = useState(defaults.date || toISO(new Date()));
  const [distance, setDistance] = useState(a.distance ?? defaults.distance ?? "");
  const [dplus, setDplus] = useState(a.dplus ?? defaults.dplus ?? "");
  const [duree, setDuree] = useState(a.duree ?? defaults.duree ?? "");
  const [feeling, setFeeling] = useState(a.feeling ?? 3);
  const [fc, setFc] = useState(a.fc ?? "");
  const [fcMax, setFcMax] = useState(a.fcMax ?? "");
  const [cadence, setCadence] = useState(a.cadence ?? "");
  const [paste, setPaste] = useState("");
  const [pasteErr, setPasteErr] = useState("");
  const [lapsText, setLapsText] = useState(
    (a.laps || []).map(l => `${l.sec} ; ${Math.round(l.m)} ; ${l.fc ?? ""}`).join("\n")
  );

  const parseLaps = () => lapsText.split("\n").map(x => x.trim()).filter(Boolean).map(line => {
    const [sec, m, fc] = line.split(";").map(v => v.trim());
    return { sec: Number(sec) || 0, m: Number(m) || 0, fc: fc ? Number(fc) : null };
  }).filter(l => l.sec > 0);

  const inputCls = "w-full rounded-lg px-2 py-1.5 text-sm outline-none";
  const inputStyle = { background: "#14201C", color: "#EDE7D9", border: "1px solid #2C3A32" };

  // Colle une ligne "date ; km ; D+ ; min ; ressenti" -> remplit les champs
  const applyPaste = () => {
    const parts = paste.split(";").map(x => x.trim());
    if (!parts[0] || !/^\d{4}-\d{2}-\d{2}$/.test(parts[0])) {
      setPasteErr("Format attendu : date ; km ; D+ ; min ; ressenti");
      return;
    }
    setDate(parts[0]);
    if (parts[1]) setDistance(parts[1]);
    if (parts[2]) setDplus(parts[2]);
    if (parts[3]) setDuree(parts[3]);
    if (parts[4]) setFeeling(Number(parts[4]));
    if (parts[5]) setFc(parts[5]);
    if (parts[6]) setFcMax(parts[6]);
    if (parts[7]) setCadence(parts[7]);
    setPaste(""); setPasteErr("");
  };

  return (
    <div className="mt-3 pt-3 space-y-2" style={{ borderTop: "1px solid #2C3A32" }}>
      <div className="flex gap-2">
        <input type="text" value={paste} onChange={e => setPaste(e.target.value)}
          placeholder="coller : date ; km ; D+ ; min ; ressenti ; FC ; FCmax ; cad"
          className="flex-1 rounded-lg px-2 py-1.5 text-xs outline-none"
          style={{ ...inputStyle, fontFamily: "'JetBrains Mono', monospace" }} />
        <button onClick={applyPaste} className="rounded-lg px-3 text-xs" style={{ background: "#2C3A32", color: "#EDE7D9" }}>
          Remplir
        </button>
      </div>
      {pasteErr && <p className="text-xs" style={{ color: "#D9793C" }}>{pasteErr}</p>}

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-2">
        <div>
          <label className="text-xs" style={{ color: "#5A6259" }}>Jour réalisé</label>
          <input type="date" value={date} onChange={e => setDate(e.target.value)} className={inputCls} style={inputStyle} />
        </div>
        <div>
          <label className="text-xs" style={{ color: "#5A6259" }}>Distance (km)</label>
          <input type="number" value={distance} onChange={e => setDistance(e.target.value)} className={inputCls} style={inputStyle} />
        </div>
        <div>
          <label className="text-xs" style={{ color: "#5A6259" }}>D+ (m)</label>
          <input type="number" value={dplus} onChange={e => setDplus(e.target.value)} className={inputCls} style={inputStyle} />
        </div>
        <div>
          <label className="text-xs" style={{ color: "#5A6259" }}>Durée (min)</label>
          <input type="number" value={duree} onChange={e => setDuree(e.target.value)} className={inputCls} style={inputStyle} />
        </div>
      </div>

      <div className="grid grid-cols-3 gap-2">
        <div>
          <label className="text-xs" style={{ color: "#5A6259" }}>FC moy</label>
          <input type="number" value={fc} onChange={e => setFc(e.target.value)} className={inputCls} style={inputStyle} />
        </div>
        <div>
          <label className="text-xs" style={{ color: "#5A6259" }}>FC max</label>
          <input type="number" value={fcMax} onChange={e => setFcMax(e.target.value)} className={inputCls} style={inputStyle} />
        </div>
        <div>
          <label className="text-xs" style={{ color: "#5A6259" }}>Cadence</label>
          <input type="number" value={cadence} onChange={e => setCadence(e.target.value)} className={inputCls} style={inputStyle} />
        </div>
      </div>

      <div>
        <label className="text-xs" style={{ color: "#5A6259" }}>Ressenti : {feeling}/5</label>
        <input type="range" min="1" max="5" value={feeling} onChange={e => setFeeling(Number(e.target.value))} className="w-full" />
      </div>

      <div>
        <label className="text-xs" style={{ color: "#5A6259" }}>
          Détail des tours (optionnel) — une ligne par tour : <span style={{ fontFamily: "'JetBrains Mono', monospace", color: "#5C7A99" }}>secondes ; mètres ; FC</span>
        </label>
        <textarea value={lapsText} onChange={e => setLapsText(e.target.value)} rows={4}
          className="w-full rounded-lg px-2 py-1.5 text-xs outline-none mt-1"
          style={{ ...inputStyle, fontFamily: "'JetBrains Mono', monospace" }}
          placeholder={"1200 ; 4000 ; 128\n30 ; 142 ; 131\n30 ; 60 ; 118"} />
      </div>

      <div className="flex gap-2">
        <button
          onClick={() => onSubmit({
            distance: Number(distance) || null,
            dplus: Number(dplus) || null,
            duree: Number(duree) || null,
            feeling,
            fc: Number(fc) || null,
            fcMax: Number(fcMax) || null,
            cadence: Number(cadence) || null,
            laps: parseLaps(),
          }, date)}
          className="flex-1 rounded-lg py-2 text-sm cursor-pointer hover:opacity-90 transition-opacity" style={{ background: "#7A8B5E", color: "#14201C" }}>
          {defaults.done ? "Mettre à jour" : "Valider cette séance"}
        </button>
        <button onClick={onCancel} className="rounded-lg py-2 px-3 text-sm cursor-pointer hover:opacity-80 transition-opacity" style={{ color: "#5A6259" }}>Annuler</button>
      </div>
    </div>
  );
}

function SessionRow({ s, onToggle, onDelete, onSaveNotes, vma }) {
  const [showActual, setShowActual] = useState(false);
  const [expanded, setExpanded] = useState(false);
  const t = TYPES[s.type];
  const complete = (actual, date) => { onToggle(s.id, { done: true, actual, date }); setShowActual(false); };

  return (
    <div className="rounded-xl p-3" style={{ background: s.done ? "#182420" : "#1C2B24", border: "1px solid #2C3A32" }}>
      <div className="flex items-center gap-3">
        <span className="w-2 h-2 rounded-full shrink-0" style={{ background: t.color }} />
        <div className="flex-1 min-w-0 cursor-pointer" onClick={() => setExpanded(v => !v)}>
          <p className="text-sm" style={{ color: "#EDE7D9", fontFamily: "'Space Grotesk', sans-serif" }}>
            {t.label} {s.generated && <span style={{ color: "#5A6259" }}>· plan</span>}

          <p className="text-xs" style={{ color: "#7A8B5E", fontFamily: "'JetBrains Mono', monospace" }}>

          </p>

            <p className="text-xs mt-1" style={{ color: "#5C7A99", fontFamily: "'JetBrains Mono', monospace" }}>
              réel: {s.actual.distance || "—"} km{s.actual.dplus ? ` · ${s.actual.dplus} m D+` : ""}{s.actual.duree ? ` · ${s.actual.duree} min` : ""}{s.actual.fc ? ` · ${s.actual.fc} bpm` : ""}{s.actual.feeling ? ` · ressenti ${s.actual.feeling}/5` : ""}
            </p>
          )}
        </div>
        <button onClick={() => onDelete(s.id)} className="text-xs px-2 py-1 rounded cursor-pointer hover:opacity-80 transition-opacity" style={{ color: "#5A6259" }}>✕</button>
        {!s.done ? (
          <button onClick={() => setShowActual(v => !v)} className="text-xs px-3 py-1.5 rounded-lg shrink-0 cursor-pointer hover:opacity-90 transition-opacity" style={{ background: "#C1622B", color: "#14201C" }}>Importer</button>
        ) : (
          <div className="flex gap-1 shrink-0">
            <button
              onClick={() => setShowActual(v => !v)}
              title="Corriger ou compléter les données réalisées"
              className="text-xs px-3 py-1.5 rounded-lg cursor-pointer hover:opacity-90 transition-opacity"
              style={{ background: "#C1622B", color: "#14201C" }}>
              Modifier
            </button>
            <button
              onClick={() => onToggle(s.id, { done: false, actual: null, date: s.generated ? null : s.date })}
              title="Annuler la validation — la séance retourne dans le planning"
              className="text-xs px-2 py-1.5 rounded-lg cursor-pointer hover:opacity-80 transition-opacity"
              style={{ background: "#2C3A32", color: "#7A8B5E" }}>
              ↺
            </button>
          </div>
        )}
      </div>
      {showActual && <ActualForm defaults={s} onSubmit={complete} onCancel={() => setShowActual(false)} />}
      {expanded && (
        <SessionDetail s={s} vma={vma} onSaveNotes={onSaveNotes} onClose={() => setExpanded(false)} />
      )}
    </div>
  );
}

// Pourcentages de VMA visés pour chaque phase de la séance
function sessionTargets(session) {
  const ph = session.phase || "build";
  if (session.type === "fractionne") {
    const work = { base: 100, build: 102, peak: 100, taper: 100 }[ph];
    return { warmup: 68, work, rest: 50, cooldown: 65 };
  }
  if (session.type === "seuil") {
    const work = { base: 85, build: 87, peak: 88, taper: 87 }[ph];
    return { warmup: 68, work, rest: 55, cooldown: 65 };
  }
  if (session.type === "cotes") {
    return { warmup: 68, work: 95, rest: 45, cooldown: 65 };
  }
  const cont = { longue: 70, fonda: 68, recup: 62 }[session.type] || 68;
  return { warmup: cont, work: cont, rest: cont, cooldown: cont };
}

/**
 * Classe chaque lap : échauffement, effort, récup ou retour au calme.
 * On se base sur l'allure rapportée à la VMA plutôt que sur l'ordre des
 * tours, car les montres mélangent tours automatiques (km) et tours manuels.
 */
function classifyLaps(laps, vma, session) {
  if (!laps || !laps.length || !vma) return [];
  const t = sessionTargets(session);
  const isInterval = ["fractionne", "seuil", "cotes"].includes(session.type);

  const enriched = laps.map((l, i) => {
    const speed = l.sec > 0 ? (l.m / l.sec) * 3.6 : 0;
    const pct = vma ? (speed / vma) * 100 : 0;
    return { ...l, i, speed, pct, pace: speed > 0 ? 60 / speed : null };
  });

  const longIdx = enriched.filter(l => l.sec >= 150).map(l => l.i);
  const firstLong = longIdx.length ? Math.min(...longIdx) : -1;
  const lastLong = longIdx.length ? Math.max(...longIdx) : -1;

  return enriched.map(l => {
    let kind;
    if (!isInterval) kind = "continu";
    else if (l.i === firstLong && l.sec >= 150) kind = "echauffement";
    else if (l.i === lastLong && l.sec >= 150 && lastLong !== firstLong) kind = "calme";
    else if (l.pct >= (t.work - 12)) kind = "effort";
    else if (l.sec <= 120) kind = "recup";
    else kind = "endurance";

    const targetPct = { echauffement: t.warmup, calme: t.cooldown, effort: t.work, recup: t.rest, endurance: t.warmup, continu: t.work }[kind];
    return { ...l, kind, targetPct };
  });
}

/**
 * Un écart ne se juge pas de la même façon selon la phase :
 * - sur un EFFORT, aller plus vite que la cible est bon, être trop lent alerte
 * - sur une RÉCUP / un échauffement / un retour au calme, c'est l'inverse :
 *   aller trop vite signifie qu'on ne récupère pas vraiment
 * Vert = conforme à l'intention de la phase, ambre = s'en écarte.
 */
const FASTER_IS_BETTER = { effort: true, continu: true };
function deltaOk(kind, delta) {
  if (delta === null) return true;
  return FASTER_IS_BETTER[kind] ? delta <= 15 : delta >= -15;
}
const deltaColor = (kind, delta) => (deltaOk(kind, delta) ? "#7A8B5E" : "#B0863C");

const KIND_LABEL = { echauffement: "Échauffement", effort: "Effort", recup: "Récup", calme: "Retour au calme", endurance: "Endurance", continu: "Séance" };
const KIND_COLOR = { echauffement: "#7A8B5E", effort: "#C1622B", recup: "#5C7A99", calme: "#7A8B5E", endurance: "#7A8B5E", continu: "#C1622B" };

function fmtPace(p) {
  if (!p || !isFinite(p)) return "—";
  const m = Math.floor(p);
  const s = Math.round((p - m) * 60);
  return s === 60 ? `${m + 1}:00` : `${m}:${String(s).padStart(2, "0")}`;
}

/**
 * Courbe de FC en fonction du temps, reconstruite à partir des tours.
 * Chaque tour est un palier à sa FC moyenne : sur du 30/30 on obtient la
 * dentelure caractéristique, et on voit la dérive cardiaque au fil des séries.
 */
function HeartRateChart({ laps }) {
  const withFc = laps.filter(l => l.fc);
  if (withFc.length < 2) return null;

  const W = 320, H = 150, PL = 30, PR = 6, PT = 8, PB = 18;
  const total = laps.reduce((a, l) => a + l.sec, 0);
  const fcs = withFc.map(l => l.fc);
  const lo = Math.floor((Math.min(...fcs) - 5) / 5) * 5;
  const hi = Math.ceil((Math.max(...fcs) + 5) / 5) * 5;

  const x = t => PL + (t / total) * (W - PL - PR);
  const y = f => PT + (1 - (f - lo) / (hi - lo)) * (H - PT - PB);

  // segments horizontaux successifs (un par tour)
  let t = 0;
  const segs = laps.map(l => {
    const s = { x1: x(t), x2: x(t + l.sec), y: l.fc ? y(l.fc) : null, kind: l.kind };
    t += l.sec;
    return s;
  }).filter(s => s.y !== null);

  // ligne continue reliant les paliers
  const path = segs.map((s, i) =>
    (i === 0 ? `M ${s.x1} ${s.y}` : `L ${s.x1} ${s.y}`) + ` L ${s.x2} ${s.y}`
  ).join(" ");

  const ticks = [lo, Math.round((lo + hi) / 2), hi];
  const timeTicks = [0, 0.25, 0.5, 0.75, 1].map(f => f * total);

  return (
    <div>
      <div className="flex items-center justify-between mb-1">
        <p className="text-xs uppercase tracking-wider" style={{ color: "#7A8B5E", fontFamily: "'JetBrains Mono', monospace" }}>
          FC dans le temps
        </p>
        <p className="text-xs" style={{ color: "#5A6259" }}>
          {Math.min(...fcs)}–{Math.max(...fcs)} bpm
        </p>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height: "auto" }}>
        {/* grille */}
        {ticks.map(f => (
          <g key={f}>
            <line x1={PL} y1={y(f)} x2={W - PR} y2={y(f)} stroke="#2C3A32" strokeWidth="0.5" />
            <text x={PL - 4} y={y(f) + 3} textAnchor="end" fontSize="8" fill="#5A6259" fontFamily="monospace">{f}</text>
          </g>
        ))}
        {timeTicks.map((tt, i) => (
          <text key={i} x={x(tt)} y={H - 5} textAnchor="middle" fontSize="8" fill="#5A6259" fontFamily="monospace">
            {Math.round(tt / 60)}′
          </text>
        ))}

        {/* fond des efforts, pour situer les fractions */}
        {segs.filter(s => s.kind === "effort").map((s, i) => (
          <rect key={i} x={s.x1} y={PT} width={Math.max(0.8, s.x2 - s.x1)} height={H - PT - PB} fill="#C1622B" opacity="0.13" />
        ))}

        <path d={path} fill="none" stroke="#D9793C" strokeWidth="1.4" strokeLinejoin="round" />
      </svg>
      <div className="flex gap-3 text-xs mt-1" style={{ color: "#5A6259" }}>
        <span><span style={{ color: "#C1622B" }}>▮</span> efforts</span>
        <span>paliers = FC moyenne par tour</span>
      </div>
    </div>
  );
}

function LapAnalysis({ session, vma }) {
  const laps = classifyLaps(session.actual?.laps, vma, session);
  if (!laps.length) return null;

  // Moyennes par phase, affichées en synthèse sous le détail
  const order = ["echauffement", "effort", "recup", "endurance", "calme", "continu"];
  const groups = order
    .map(k => ({ kind: k, items: laps.filter(l => l.kind === k) }))
    .filter(g => g.items.length);

  const counters = {};

  return (
    <div className="rounded-lg p-3 space-y-3" style={{ background: "#1C2B24", border: "1px solid #2C3A32" }}>
      <p className="text-sm" style={{ fontFamily: "'Space Grotesk', sans-serif", color: "#C1622B" }}>
        Déroulé de la séance
      </p>

      <HeartRateChart laps={laps} />

      <p className="text-xs leading-relaxed" style={{ color: "#5A6259" }}>
        Écart à l'allure cible : <span style={{ color: "#EDE7D9" }}>−</span> plus rapide,
        <span style={{ color: "#EDE7D9" }}> +</span> plus lent.
        <span style={{ color: "#7A8B5E" }}> Vert</span> = conforme à l'intention de la phase
        (vite sur les efforts, lent sur les récups),
        <span style={{ color: "#B0863C" }}> ambre</span> = s'en écarte.
      </p>

      {/* ordre chronologique : chaque tour tel qu'il s'est enchaîné */}
      <div className="space-y-1">
        {laps.map(l => {
          counters[l.kind] = (counters[l.kind] || 0) + 1;
          const n = counters[l.kind];
          const target = vma ? 60 / (vma * l.targetPct / 100) : null;
          const delta = l.pace && target ? Math.round((l.pace - target) * 60) : null;
          const label = KIND_LABEL[l.kind] + (["effort", "recup"].includes(l.kind) ? ` ${n}` : "");

          return (
            <div key={l.i} className="flex items-baseline justify-between text-xs py-0.5"
              style={{ borderBottom: "1px solid #22302A" }}>
              <span className="shrink-0" style={{ color: KIND_COLOR[l.kind], minWidth: "5.5rem" }}>{label}</span>
              <span style={{ fontFamily: "'JetBrains Mono', monospace", color: "#5A6259" }}>
                {l.sec}s·{Math.round(l.m)}m
              </span>
              <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>
                <span style={{ color: "#C1622B" }}>{fmtPace(l.pace)}</span>
                <span style={{ color: "#5A6259" }}>/{fmtPace(target)}</span>
              </span>
              {delta !== null && (
                <span style={{ fontFamily: "'JetBrains Mono', monospace", color: deltaColor(l.kind, delta), minWidth: "2.6rem", textAlign: "right" }}>
                  {delta > 0 ? "+" : ""}{delta}s
                </span>
              )}
              <span style={{ fontFamily: "'JetBrains Mono', monospace", color: "#5C7A99", minWidth: "2.2rem", textAlign: "right" }}>
                {l.fc ? Math.round(l.fc) : "—"}
              </span>
            </div>
          );
        })}
      </div>

      {/* synthèse par phase */}
      <div className="pt-2 space-y-1" style={{ borderTop: "1px solid #2C3A32" }}>
        <p className="text-xs uppercase tracking-wider" style={{ color: "#7A8B5E", fontFamily: "'JetBrains Mono', monospace" }}>
          Moyennes
        </p>
        {groups.map(g => {
          const totSec = g.items.reduce((a, l) => a + l.sec, 0);
          const totM = g.items.reduce((a, l) => a + l.m, 0);
          const avgPace = totM > 0 ? (totSec / 60) / (totM / 1000) : null;
          const fcs = g.items.filter(l => l.fc).map(l => l.fc);
          const avgFc = fcs.length ? Math.round(fcs.reduce((a, b) => a + b, 0) / fcs.length) : null;
          const target = vma ? 60 / (vma * g.items[0].targetPct / 100) : null;
          const delta = avgPace && target ? Math.round((avgPace - target) * 60) : null;
          return (
            <div key={g.kind} className="flex justify-between text-xs">
              <span style={{ color: KIND_COLOR[g.kind] }}>
                {KIND_LABEL[g.kind]}{g.items.length > 1 ? ` ×${g.items.length}` : ""}
              </span>
              <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>
                <span style={{ color: "#C1622B" }}>{fmtPace(avgPace)}</span>
                <span style={{ color: "#5A6259" }}>/{fmtPace(target)}</span>
                {delta !== null && (
                  <span style={{ color: deltaColor(g.kind, delta), marginLeft: 5 }}>
                    {delta > 0 ? "+" : ""}{delta}s
                  </span>
                )}
                {avgFc && <span style={{ color: "#5C7A99", marginLeft: 6 }}>{avgFc}</span>}
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function paceStr(distanceKm, dureeMin) {
  if (!distanceKm || !dureeMin) return null;
  const p = dureeMin / distanceKm;
  const m = Math.floor(p);
  const sec = Math.round((p - m) * 60);
  return sec === 60 ? `${m + 1}:00` : `${m}:${String(sec).padStart(2, "0")}`;
}

// Une ligne = deux barres proportionnelles (prévu en gris, réalisé en orange)
function CompareRow({ label, planned, actual, unit, lowerIsBetter = false }) {
  const max = Math.max(planned || 0, actual || 0) || 1;
  const pctP = ((planned || 0) / max) * 100;
  const pctA = ((actual || 0) / max) * 100;
  const delta = planned && actual ? ((actual - planned) / planned) * 100 : null;
  const good = delta === null ? null : (lowerIsBetter ? delta <= 2 : delta >= -10);

  return (
    <div className="space-y-1">
      <div className="flex justify-between text-xs">
        <span style={{ color: "#9CAA9E" }}>{label}</span>
        {/* les chiffres reprennent la couleur de leur barre : gris = prévu, orange = réalisé */}
        <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>
          <span style={{ color: "#C1622B" }}>{actual ?? "—"}</span>
          <span style={{ color: "#5A6259" }}> / {planned ?? "—"} {unit}</span>
          {delta !== null && (
            <span style={{ color: good ? "#7A8B5E" : "#B0863C", marginLeft: 6 }}>
              {delta > 0 ? "+" : ""}{Math.round(delta)}%
            </span>
          )}
        </span>
      </div>
      <div className="space-y-0.5">
        <div className="h-1.5 rounded-full" style={{ width: `${pctP}%`, background: "#2C3A32", minWidth: 2 }} />
        <div className="h-1.5 rounded-full" style={{ width: `${pctA}%`, background: "#C1622B", minWidth: 2 }} />
      </div>
    </div>
  );
}

function SessionReport({ s, vma }) {
  const a = s.actual || {};

  // Sur une séance à intervalles, seule la FC pendant les efforts est
  // interprétable — la moyenne de séance est diluée par les récups.
  const effortLaps = classifyLaps(a.laps, vma, s).filter(l => l.kind === "effort" && l.fc);
  const effortFc = effortLaps.length
    ? {
        avg: Math.round(effortLaps.reduce((x, l) => x + l.fc, 0) / effortLaps.length),
        max: Math.round(Math.max(...effortLaps.map(l => l.fc))),
      }
    : null;
  const planPace = paceStr(s.distance, s.duree);
  const realPace = paceStr(a.distance, a.duree);

  // écart d'allure en secondes/km, pour un commentaire utile
  const paceDeltaSec = (s.distance && s.duree && a.distance && a.duree)
    ? Math.round(((a.duree / a.distance) - (s.duree / s.distance)) * 60)
    : null;

  const gradPlan = s.distance && s.dplus ? Math.round(s.dplus / s.distance) : null;
  const gradReal = a.distance && a.dplus ? Math.round(a.dplus / a.distance) : null;

  // % de VMA estimé sur la séance, à partir de l'allure moyenne réelle
  const vmaPct = (vma && a.distance && a.duree)
    ? Math.round((a.distance / (a.duree / 60)) / vma * 100)
    : null;

  return (
    <div className="rounded-lg p-3 space-y-3" style={{ background: "#1C2B24", border: "1px solid #2C3A32" }}>
      <div className="flex items-center justify-between">
        <p className="text-sm" style={{ fontFamily: "'Space Grotesk', sans-serif", color: "#C1622B" }}>Compte rendu</p>
        <p className="text-xs" style={{ color: "#5A6259", fontFamily: "'JetBrains Mono', monospace" }}>
          {a.feeling ? `ressenti ${a.feeling}/5` : ""}
        </p>
      </div>

      <div className="flex gap-3 text-xs">
        <span style={{ color: "#5A6259" }}>▬ prévu</span>
        <span style={{ color: "#C1622B" }}>▬ réalisé</span>
      </div>

      <div className="space-y-2.5">
        <CompareRow label="Distance" planned={s.distance} actual={a.distance} unit="km" />
        {(s.dplus || a.dplus) && <CompareRow label="Dénivelé" planned={s.dplus} actual={a.dplus} unit="m" />}
        <CompareRow label="Durée" planned={s.duree} actual={a.duree} unit="min" />
      </div>

      {(planPace || realPace) && (
        <div className="pt-2" style={{ borderTop: "1px solid #2C3A32" }}>
          <div className="flex justify-between text-xs">
            <span style={{ color: "#9CAA9E" }}>Allure moyenne</span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>
              <span style={{ color: "#C1622B" }}>{realPace || "—"}</span>
              <span style={{ color: "#5A6259" }}> / {planPace || "—"} /km</span>
            </span>
          </div>
          {paceDeltaSec !== null && (
            <p className="text-xs mt-1" style={{ color: Math.abs(paceDeltaSec) <= 15 ? "#7A8B5E" : "#B0863C" }}>
              {paceDeltaSec === 0 ? "pile sur l'allure prévue"
                : paceDeltaSec > 0 ? `${paceDeltaSec}s/km plus lent que prévu`
                : `${-paceDeltaSec}s/km plus rapide que prévu`}
            </p>
          )}
        </div>
      )}

      {(gradPlan || gradReal) && (
        <div className="flex justify-between text-xs">
          <span style={{ color: "#9CAA9E" }}>Densité D+</span>
          <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>
            <span style={{ color: "#C1622B" }}>{gradReal ?? "—"}</span>
            <span style={{ color: "#5A6259" }}> / {gradPlan ?? "—"} m/km</span>
          </span>
        </div>
      )}

      {effortFc && (
        <div className="rounded-lg p-2" style={{ background: "#22302A" }}>
          <div className="flex justify-between text-xs">
            <span style={{ color: "#C1622B" }}>FC sur les efforts uniquement</span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", color: "#EDE7D9" }}>
              {effortFc.avg} bpm <span style={{ color: "#5A6259" }}>(max {effortFc.max})</span>
            </span>
          </div>
          <p className="text-xs mt-1" style={{ color: "#5A6259" }}>
            La FC moyenne de séance mélange échauffement et récups : sur du fractionné, c'est cette valeur-ci qui compte.
          </p>
        </div>
      )}

      {(a.fc || a.fcMax || a.cadence) && (
        <div className="pt-2 grid grid-cols-3 gap-2" style={{ borderTop: "1px solid #2C3A32" }}>
          <div className="text-center">
            <p className="text-lg" style={{ fontFamily: "'JetBrains Mono', monospace", color: a.fc ? "#EDE7D9" : "#5A6259" }}>{a.fc ?? "—"}</p>
            <p className="text-xs" style={{ color: "#7A8B5E" }}>FC moy</p>
          </div>
          <div className="text-center">
            <p className="text-lg" style={{ fontFamily: "'JetBrains Mono', monospace", color: a.fcMax ? "#EDE7D9" : "#5A6259" }}>{a.fcMax ?? "—"}</p>
            <p className="text-xs" style={{ color: "#7A8B5E" }}>FC max</p>
          </div>
          <div className="text-center">
            <p className="text-lg" style={{ fontFamily: "'JetBrains Mono', monospace", color: a.cadence ? "#EDE7D9" : "#5A6259" }}>{a.cadence ?? "—"}</p>
            <p className="text-xs" style={{ color: "#7A8B5E" }}>cadence</p>
          </div>
        </div>
      )}

      {vmaPct && (
        <p className="text-xs" style={{ color: "#5C7A99", fontFamily: "'JetBrains Mono', monospace" }}>
          allure moyenne ≈ {vmaPct}% VMA
        </p>
      )}
    </div>
  );
}

function PlanView({ sessions, evaluations, onToggle, onDelete, onSaveNotes, vma }) {
  const weeks = useMemo(() => {
    const map = new Map();
    sessions.forEach(s => {
      const wk = sessionWeek(s);
      if (!map.has(wk)) map.set(wk, []);
      map.get(wk).push(s);
    });
    return [...map.entries()].sort(([a], [b]) => a.localeCompare(b));
  }, [sessions]);

  const todayISO = toISO(new Date());

  return (
    <div className="space-y-4">
      {weeks.map(([weekStart, weekSessions]) => {
        const isPast = addDays(weekStart, 6) < new Date();
        if (isPast && weekSessions.every(s => s.done || !s.generated)) return null; // masque semaines passées complètes
        const phase = weekSessions.find(s => s.generated)?.phase;
        const evalInfo = evaluations[weekStart];
        const adjustedFrom = Object.entries(evaluations).find(([wk, e]) => toISO(addDays(wk, 7)) === weekStart && e.multiplier !== 1);

        return (
          <div key={weekStart}>
            <div className="flex items-center justify-between px-1 mb-2">
              <p className="text-xs uppercase tracking-wider" style={{ color: "#7A8B5E", fontFamily: "'JetBrains Mono', monospace" }}>
                Semaine du {fmtDate(weekStart)} {phase && `· ${PHASE_LABEL[phase]}`}
              </p>
              <p className="text-xs" style={{ color: "#5A6259" }}>ordre conseillé</p>
            </div>
            {adjustedFrom && (
              <div className="rounded-lg px-3 py-2 mb-2 text-xs" style={{ background: "#2A2018", color: "#D9793C", border: "1px solid #3A2C1C" }}>
                {adjustedFrom[1].reason}
              </div>
            )}
            <div className="space-y-2">
              {weekSessions.sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || (a.date || "").localeCompare(b.date || "")).map(s => (
                <SessionRow key={s.id} s={s} onToggle={onToggle} onDelete={onDelete} onSaveNotes={onSaveNotes} vma={vma} />
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}
